  - main [ref=e65]:
    - article [ref=e66]:
      - generic [ref=e68]:
        - heading "Thank you for everything you ship. 6 months of Claude Max on us." [level=1] [ref=e69]
        - generic [ref=e70]:
          - paragraph [ref=e71]: Open-source contributors keep the ecosystem running. The Claude for Open Source Program is our way of saying thank you for all your hard work, with 6 months of free Claude Max 20x. Apply now.
          - heading "Who should apply:" [level=2] [ref=e72]
          - list [ref=e73]:
            - listitem [ref=e74]:
              - text: ‍
              - strong [ref=e75]: "Maintainers and library authors:"
              - text: "You maintain packages that others build on: 500 or more dependent repos, 100 or more dependent packages, or 200,000 or more combined monthly downloads across any registry (npm, PyPI, crates.io, RubyGems, or similar)"
            - listitem [ref=e76]:
              - strong [ref=e77]: "Core contributors:"
              - text: "You're a listed committer or maintainer on a recognized foundation or language project: CPython, Rust team, Node.js TSC, Apache PMC, CNCF, Kubernetes, Linux kernel, Django, Rails, or similar"
            - listitem [ref=e78]:
              - strong [ref=e79]: "Active contributors:"
              - text: You've authored 100 or more pull requests merged into repos you don't own in the last 12 months
            - listitem [ref=e80]:
              - strong [ref=e81]: "Community builders:"
              - text: One of your repos has had 20 or more unique external contributors with merged pull requests in the last 12 months
            - listitem [ref=e82]:
              - strong [ref=e83]: "Critical infrastructure:"
              - text: Any repo you maintain has an OpenSSF criticality score of 0.4 or above
          - paragraph [ref=e84]:
            - strong [ref=e85]: Don't quite fit?
            - text: If you maintain something the ecosystem quietly depends on, apply anyway and tell us about it.
        - generic [ref=e87]:
          - heading "How it works" [level=3] [ref=e88]
          - paragraph [ref=e89]: At the end of the 6-month period, your complimentary subscription ends. We'll email you before it does. If you had a paid plan, it resumes at your prior plan and rate unless you cancel; otherwise your account returns to the free plan.
          - paragraph [ref=e90]:
            - text: Read
            - link "Terms and Conditions" [ref=e91] [cursor=pointer]:
              - /url: https://www.anthropic.com/claude-for-oss-terms
            - text: .
