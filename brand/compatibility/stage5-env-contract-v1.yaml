schema: ketos.brand-environment-contract
version: 1
status: frozen-local
scope:
  included:
  - Settings model fields
  - AuthSettings model fields
  - fixed KETOS_*/LANGFLOW_* direct-read suffixes reviewed in BRAND_ENV_POLICIES
  excluded_dynamic_namespaces:
  - namespace: third-party provider credential variables
    reason: names are provider-defined rather than fixed Ketos/Langflow settings suffixes
  - namespace: user-selected runtime and environment variables
    reason: names are data selected at runtime rather than fixed branded settings suffixes
  - namespace: KETOS_<provider-variable> convenience aliases
    reason: bounded provider credential aliasing is not a LANGFLOW_* compatibility setting
source:
  tree_sha256: ccf68a24e0d875ac73559f135437a751e71841727e9c046edec4cdfe51d5e307
