name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy docs from"
        required: false
        default: "main"
        type: string

jobs:
  deploy:
    name: Deploy to GitHub Pages
    if: ${{ vars.KETOS_EXTERNAL_RELEASE_ENABLED == 'true' && github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && vars.KETOS_RELEASE_COMMIT == github.sha && vars.KETOS_EXTERNAL_RELEASE == format('publish:{0}', github.sha) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"
          prune-cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ./docs/package-lock.json

      - name: Install dependencies
        run: cd docs && npm install
      - name: Build website
        run: cd docs && npm run build
        env:
          SEGMENT_PUBLIC_WRITE_KEY: ${{ vars.DOCS_PROD_IBM_SEGMENT_PUBLIC_WRITE_KEY }}

      # Popular action to deploy to GitHub Pages:
      # Docs: https://github.com/peaceiris/actions-gh-pages#%EF%B8%8F-docusaurus
      - name: Authorize immutable external deployment
        env:
          KETOS_RELEASE_COMMIT: ${{ vars.KETOS_RELEASE_COMMIT }}
          KETOS_EXTERNAL_RELEASE: ${{ vars.KETOS_EXTERNAL_RELEASE }}
        run: uv run scripts/ci/require_external_release.py
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Build output to publish to the `gh-pages` branch:
          publish_dir: ./docs/build
          # The following lines assign commit authorship to the official
          # GH-Actions bot for deploys to `gh-pages` branch:
          # https://github.com/actions/checkout/issues/13#issuecomment-724415212
          # The GH actions bot is used by default if you didn't specify the two fields.
          # You can swap them out with your own user credentials.
