[project]
name = "kfx-docling"
version = "0.1.1"
description = "Docling document processing components as a standalone Ketos Extension Bundle."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Ketos", email = "contact@ketos.test" },
]
keywords = ["ketos", "kfx", "extension", "bundle", "docling", "documents"]

# Keep the full local converter and OCR stack optional. docling-core remains a
# base dependency because the bundle exchanges DoclingDocument objects even when
# conversion happens remotely.
dependencies = [
    "kfx>=1.10.0.dev0,<2.0.0",
    "httpx>=0.28.1,<1.0.0",
    "docling-core>=2.36.1,<3.0.0",
]

[project.optional-dependencies]
local = [
    "docling>=2.36.1,<3.0.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "tesserocr>=2.8.0",
    "rapidocr-onnxruntime>=1.4.4",
    "ocrmac>=1.0.0; sys_platform == 'darwin'",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
]
chunking = [
    "docling-core[chunking]>=2.36.1,<3.0.0",
    "tiktoken>=0.7.0",
]
image-description = [
    "kfx-docling[local]",
    "langchain-docling>=1.1.0",
]
all = [
    "kfx-docling[local,chunking,image-description]",
]

[project.urls]
Homepage = "https://git.ketos.test/ketos/ketos"
Documentation = "https://docs.ketos.test/bundles-docling"
Repository = "https://git.ketos.test/ketos/ketos"

[project.entry-points."ketos.extensions"]
kfx-docling = "kfx_docling"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kfx_docling"]
include = ["src/kfx_docling/extension.json", "src/kfx_docling/components/**/*.py"]

[tool.hatch.build.targets.sdist]
include = [
    "src/kfx_docling",
    "extension.json",
    "README.md",
    "pyproject.toml",
]
