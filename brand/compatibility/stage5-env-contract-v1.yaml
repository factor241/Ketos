resolution:
  precedence: KETOS_* > LANGFLOW_* > default
  legacy_only: select legacy and emit one value-redacted deprecation warning
  equal_dual: accept and select canonical without conflict diagnostic
  unequal_dual:
    public_warn: select canonical and emit one value-redacted conflict warning
    public_error: fail closed without selecting or disclosing either value
    secret_error: fail closed without selecting or disclosing either value
  diagnostics:
    values_redacted: true
    immutable_metadata_only: true
    allowed_fields:
    - code
    - canonical_name
    - legacy_name
    - sensitivity
    - selected
  unknown_suffix: fail closed with UnclassifiedBrandEnvError
  unprefixed_tier: false
