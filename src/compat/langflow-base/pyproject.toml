[project]
name = "langflow-base"
version = "0.10.2"
description = "Compatibility imports for the canonical Ketos backend"
license = "MIT"
requires-python = ">=3.10,<3.15"
dependencies = ["ketos-base==0.10.2", "lfx==1.10.2"]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langflow", "src/langflow_compat"]

[tool.hatch.build.targets.sdist]
exclude = ["/tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101", "S603"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.9.10",
]
