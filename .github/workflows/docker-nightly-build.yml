name: Docker Nightly Build and Push
run-name: Docker Nightly Build @${{ inputs.release_type }} by @${{ github.actor }}

on:
  workflow_call:
    inputs:
      release_type:
        required: true
        type: string
        description: "Nightly release type. One of 'nightly-main', 'nightly-base', 'nightly-main-all'."
      ref:
        required: true
        type: string
        description: "Ref to check out (branch, tag, or commit). This is required -- it specifies where the source code for the release is located."
      push_to_registry:
        required: false
        type: boolean
        default: false
        description: "Reserved compatibility input; external registry publishing is disabled."

  workflow_dispatch:
    inputs:
      release_type:
        description: "Nightly release type. One of 'nightly-main', 'nightly-base', 'nightly-main-all'."
        required: true
        type: choice
        options:
          - nightly-main
          - nightly-base
          - nightly-main-all
      ref:
        required: true
        type: string
        description: "Ref to check out (branch, tag, or commit). This is required -- it specifies where the source code for the release is located. Note that if running via Github Actions, this tag (formatted as, e.g., v1.5.1.dev36) must be manually created and pushed to a branch prior to running the workflow."
      push_to_registry:
        description: "Reserved compatibility input; external registry publishing is disabled."
        required: false
        type: boolean
        default: false

env:
  PYTHON_VERSION: "3.13"

jobs:
  build-nightly-base:
    name: Build Nightly Base Package
    if: ${{ inputs.release_type == 'nightly-base' }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: [Ketos-runner]
          - arch: arm64
            runner:
              [self-hosted, linux, ARM64, ketos-local-arm64-40gb-ephemeral]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Environment
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"
          prune-cache: false

      - name: Get version for tagging
        id: version
        run: |
          echo "Extracting base version from pyproject.toml"
          # Anchor to the ketos-base workspace-root line (same pattern as the
          # ketos extraction below): the unanchored grep used to match a
          # dependency line whose version sat in field 3, but uv tree now lists
          # the ketos-base root line first, which has no third field.
          version=$(uv tree 2>/dev/null | grep -E '^ketos-base[[:space:]]' | cut -d' ' -f2 | sed 's/^v//' | head -n 1)


          # Verify nightly tag format
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.dev[0-9]+$ ]]; then
            echo "Base version format is incorrect. Must be in the format (e.g.) v1.5.1.dev36"
            exit 1
          fi

          echo "Using version: $version"
          echo version=$version >> $GITHUB_OUTPUT

      - name: Set nightly tags
        id: tags
        run: |
          version="${{ steps.version.outputs.version }}"
          echo "docker_tags=registry.invalid/ketos/ketos-nightly:base-${version}-${{ matrix.arch }},registry.invalid/ketos/ketos:base-${version}-${{ matrix.arch }}" >> $GITHUB_OUTPUT
          echo "ghcr_tags=registry.invalid/ketos/ketos-nightly:base-${version}-${{ matrix.arch }},registry.invalid/ketos/ketos:base-${version}-${{ matrix.arch }}" >> $GITHUB_OUTPUT

      - name: Docker cleanup
        run: |
          docker system prune -af --volumes || true
          docker buildx prune -af || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.TEMP_GHCR_TOKEN}}

      - name: Build and push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false # external publish disabled; immutable gate required
          pull: true
          file: ./docker/build_and_push_base.Dockerfile
          tags: ${{ steps.tags.outputs.docker_tags }}
          platforms: linux/${{ matrix.arch }}
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push to GitHub Container Registry
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false # external publish disabled; immutable gate required
          pull: true
          file: ./docker/build_and_push_base.Dockerfile
          tags: ${{ steps.tags.outputs.ghcr_tags }}
          platforms: linux/${{ matrix.arch }}
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-nightly-main:
    name: Build Nightly Main Package
    if: ${{ inputs.release_type == 'nightly-main' }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: [Ketos-runner]
          - arch: arm64
            runner:
              [self-hosted, linux, ARM64, ketos-local-arm64-40gb-ephemeral]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Environment
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"
          prune-cache: false

      - name: Get version for tagging
        id: version
        run: |
          echo "Extracting main version from pyproject.toml"
          version=$(uv tree 2>/dev/null | grep -E '^ketos(-nightly)?[[:space:]]' | cut -d' ' -f2 | sed 's/^v//')

          # Verify nightly tag format
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.dev[0-9]+$ ]]; then
            echo "Main version format is incorrect. Must be in the format (e.g.) v1.5.1.dev36"
            exit 1
          fi

          echo "Using version: $version"
          echo version=$version >> $GITHUB_OUTPUT

      - name: Set nightly tags
        id: tags
        run: |
          version="${{ steps.version.outputs.version }}"
          echo "docker_tags=registry.invalid/ketos/ketos-nightly:${version}-${{ matrix.arch }},registry.invalid/ketos/ketos:${version}-${{ matrix.arch }}" >> $GITHUB_OUTPUT
          echo "ghcr_tags=registry.invalid/ketos/ketos-nightly:${version}-${{ matrix.arch }},registry.invalid/ketos/ketos:${version}-${{ matrix.arch }}" >> $GITHUB_OUTPUT

      - name: Docker cleanup
        run: |
          docker system prune -af --volumes || true
          docker buildx prune -af || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.TEMP_GHCR_TOKEN}}

      - name: Build and push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false # external publish disabled; immutable gate required
          pull: true
          file: ./docker/build_and_push.Dockerfile
          tags: ${{ steps.tags.outputs.docker_tags }}
          platforms: linux/${{ matrix.arch }}
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push to GitHub Container Registry
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false # external publish disabled; immutable gate required
          pull: true
          file: ./docker/build_and_push.Dockerfile
          tags: ${{ steps.tags.outputs.ghcr_tags }}
          platforms: linux/${{ matrix.arch }}
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-nightly-main-all:
    name: Build Nightly Main All Package
    if: ${{ inputs.release_type == 'nightly-main-all' }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: [Ketos-runner]
          - arch: arm64
            runner:
              [self-hosted, linux, ARM64, ketos-local-arm64-40gb-ephemeral]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Environment
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"
          prune-cache: false

      - name: Get version for tagging
        id: version
        run: |
          echo "Extracting main version from pyproject.toml"
          version=$(uv tree 2>/dev/null | grep -E '^ketos(-nightly)?[[:space:]]' | cut -d' ' -f2 | sed 's/^v//')

          # Verify nightly tag format
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.dev[0-9]+$ ]]; then
            echo "Main version format is incorrect. Must be in the format (e.g.) v1.5.1.dev36"
            exit 1
          fi

          echo "Using version: $version"
          echo version=$version >> $GITHUB_OUTPUT

      - name: Set nightly tags
        id: tags
        run: |
          version="${{ steps.version.outputs.version }}"
          echo "docker_tags=registry.invalid/ketos/ketos-nightly-all:${version}-${{ matrix.arch }},registry.invalid/ketos/ketos-all:${version}-${{ matrix.arch }}" >> $GITHUB_OUTPUT
          echo "ghcr_tags=registry.invalid/ketos/ketos-nightly-all:${version}-${{ matrix.arch }},registry.invalid/ketos/ketos-all:${version}-${{ matrix.arch }}" >> $GITHUB_OUTPUT

      - name: Docker cleanup
        run: |
          docker system prune -af --volumes || true
          docker buildx prune -af || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.TEMP_GHCR_TOKEN}}

      - name: Build and push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false # external publish disabled; immutable gate required
          pull: true
          file: ./docker/build_and_push_with_extras.Dockerfile
          tags: ${{ steps.tags.outputs.docker_tags }}
          platforms: linux/${{ matrix.arch }}
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push to GitHub Container Registry
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false # external publish disabled; immutable gate required
          pull: true
          file: ./docker/build_and_push_with_extras.Dockerfile
          tags: ${{ steps.tags.outputs.ghcr_tags }}
          platforms: linux/${{ matrix.arch }}
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-nightly-manifest:
    name: External nightly manifest publication disabled
    needs: [build-nightly-base, build-nightly-main, build-nightly-main-all]
    runs-on: ubuntu-latest
    if: ${{ inputs.push_to_registry }}
    steps:
      - name: Setup Environment
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"
          prune-cache: false

      - name: Check out the code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Get version
        id: version
        run: |
          if [[ "${{ inputs.release_type }}" == "nightly-base" ]]; then
            version=$(uv tree 2>/dev/null | grep -E '^ketos-base[[:space:]]' | cut -d' ' -f2 | sed 's/^v//' | head -n 1)
          else
            version=$(uv tree 2>/dev/null | grep -E '^ketos(-nightly)?[[:space:]]' | cut -d' ' -f2 | sed 's/^v//')
          fi
          echo "Using version: $version"
          echo version=$version >> $GITHUB_OUTPUT

      - name: Set nightly tags
        id: tags
        run: |
          version="${{ steps.version.outputs.version }}"
          case "${{ inputs.release_type }}" in
            "nightly-base")
              # Push versioned tag to canonical ketos repo (matches PyPI ketos-base .devN publish).
              # :base-latest is only set on the -nightly repo to avoid overwriting the stable :base-latest
              # on registry.invalid/ketos/ketos with a pre-release image.
              echo "final_tags=registry.invalid/ketos/ketos-nightly:base-${version},registry.invalid/ketos/ketos-nightly:base-latest,registry.invalid/ketos/ketos:base-${version},registry.invalid/ketos/ketos-nightly:base-${version},registry.invalid/ketos/ketos-nightly:base-latest,registry.invalid/ketos/ketos:base-${version}" >> $GITHUB_OUTPUT
              echo "arch_base=registry.invalid/ketos/ketos-nightly:base-${version}" >> $GITHUB_OUTPUT
              echo "ghcr_arch_base=registry.invalid/ketos/ketos-nightly:base-${version}" >> $GITHUB_OUTPUT
              ;;
            "nightly-main")
              # Push versioned tag to canonical ketos repo (matches PyPI ketos .devN publish).
              # :latest is only set on the -nightly repo to avoid overwriting the stable :latest
              # on registry.invalid/ketos/ketos with a pre-release image.
              echo "final_tags=registry.invalid/ketos/ketos-nightly:${version},registry.invalid/ketos/ketos-nightly:latest,registry.invalid/ketos/ketos:${version},registry.invalid/ketos/ketos-nightly:${version},registry.invalid/ketos/ketos-nightly:latest,registry.invalid/ketos/ketos:${version}" >> $GITHUB_OUTPUT
              echo "arch_base=registry.invalid/ketos/ketos-nightly:${version}" >> $GITHUB_OUTPUT
              echo "ghcr_arch_base=registry.invalid/ketos/ketos-nightly:${version}" >> $GITHUB_OUTPUT
              ;;
            "nightly-main-all")
              # Push versioned tag to canonical ketos-all repo (matches PyPI publish).
              # :latest is only set on the -nightly-all repo to avoid overwriting the stable :latest
              # on registry.invalid/ketos/ketos-all with a pre-release image.
              echo "final_tags=registry.invalid/ketos/ketos-nightly-all:${version},registry.invalid/ketos/ketos-nightly-all:latest,registry.invalid/ketos/ketos-all:${version},registry.invalid/ketos/ketos-nightly-all:${version},registry.invalid/ketos/ketos-nightly-all:latest,registry.invalid/ketos/ketos-all:${version}" >> $GITHUB_OUTPUT
              echo "arch_base=registry.invalid/ketos/ketos-nightly-all:${version}" >> $GITHUB_OUTPUT
              echo "ghcr_arch_base=registry.invalid/ketos/ketos-nightly-all:${version}" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "Error: Invalid release_type: ${{ inputs.release_type }}" >&2
              exit 1
              ;;
          esac

      - name: Confirm external nightly manifest publication is disabled
        run: echo "Architecture images are local-only; no remote nightly manifest is published."
