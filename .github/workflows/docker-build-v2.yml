name: Docker Build and Push v2
run-name: Docker Build and Push @${{ inputs.release_type }} by @${{ github.actor }}

on:
  workflow_call:
    inputs:
      release_type:
        required: true
        type: string
        description: "Release type. One of 'main', 'main-backend', 'main-frontend', 'main-ep', 'base', 'main-all'."
      pre_release:
        required: false
        type: boolean
        default: false
      ref:
        required: true
        type: string
        description: "Ref to check out (branch, tag, or commit). This is required -- it specifies where the source code for the release is located."
      version_override:
        required: false
        type: string
        default: ""
        description: "Resolved version to use for image tags. When omitted, the workflow computes the version from the checked-out ref and registry history."
      push_to_registry:
        required: false
        type: boolean
        default: false
        description: "Reserved compatibility input; external registry publishing is disabled."

  workflow_dispatch:
    inputs:
      release_type:
        description: "Type of release. One of 'main', 'main-backend', 'main-frontend', 'main-ep', 'base', 'main-all'."
        required: true
        type: choice
        options:
          - main
          - main-backend
          - main-frontend
          - main-ep
          - base
          - main-all
      pre_release:
        description: "Whether this is a pre-release."
        required: false
        type: boolean
        default: false
      ref:
        required: true
        type: string
        description: "Ref to check out (branch, tag, or commit). This is required -- it specifies where the source code for the release is located."
      version_override:
        description: "Resolved version to use for image tags. Leave blank to compute from the checked-out ref and registry history."
        required: false
        type: string
        default: ""
      push_to_registry:
        description: "Reserved compatibility input; external registry publishing is disabled."
        required: false
        type: boolean
        default: false

env:
  PYTHON_VERSION: "3.13"

jobs:
  determine-base-version:
    name: Determine Base Version
    if: ${{ inputs.release_type == 'base' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      skipped: ${{ steps.version.outputs.skipped }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Environment
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"
          prune-cache: false

      - name: Determine version
        id: version
        run: |
          version=$(uv tree 2>/dev/null | grep '^ketos-base' | cut -d' ' -f2 | sed 's/^v//')
          echo "Base version from pyproject.toml: $version"

          if [ -n "${{ inputs.version_override }}" ]; then
            version="${{ inputs.version_override }}"
            echo "Using version override: $version"
            if [ ${{inputs.pre_release}} != "true" ]; then
              last_released_version=$(curl -s "https://registry.hub.docker.com/v2/repositories/registry.invalid/ketos/ketos/tags?page_size=100" | jq -r '.results[].name' | grep -E '^base-' | grep -vE '\-(amd64|arm64)$' | grep -v 'latest' | sed 's/^base-//' | sort -V | tail -n 1)
              echo "Latest base release version: $last_released_version"
            fi
          elif [ ${{inputs.pre_release}} == "true" ]; then
            released_versions=$(curl -s "https://registry.hub.docker.com/v2/repositories/registry.invalid/ketos/ketos/tags?page_size=100" | jq -r '.results[].name' | grep -E '^base-' | grep -vE '\-(amd64|arm64)$' | sed 's/^base-//' || true)
            version="$(printf '%s\n' "$released_versions" | uv run ./scripts/ci/ketos_pre_release_tag.py "$version" -)"
            echo "Base pre-release version to be released: $version"
          else
            last_released_version=$(curl -s "https://registry.hub.docker.com/v2/repositories/registry.invalid/ketos/ketos/tags?page_size=100" | jq -r '.results[].name' | grep -E '^base-' | grep -vE '\-(amd64|arm64)$' | grep -v 'latest' | sed 's/^base-//' | sort -V | tail -n 1)
            echo "Latest base release version: $last_released_version"
          fi

          if [ "$version" = "$last_released_version" ]; then
            echo "Base docker version $version is already released. Skipping release."
            echo skipped=true >> $GITHUB_OUTPUT
            exit 0
          else
            echo version=$version >> $GITHUB_OUTPUT
            echo skipped=false >> $GITHUB_OUTPUT
          fi

  determine-main-version:
    name: Determine Main Version
    if: ${{ inputs.release_type != 'base' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      skipped: ${{ steps.version.outputs.skipped }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Environment
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"
          prune-cache: false

      - name: Determine version
        id: version
        run: |
          version=$(uv tree 2>/dev/null | grep -E '^ketos(-nightly)?[[:space:]]' | cut -d' ' -f2 | sed 's/^v//')
          echo "Main version from pyproject.toml: $version"

          if [ -n "${{ inputs.version_override }}" ]; then
            version="${{ inputs.version_override }}"
            echo "Using version override: $version"
            if [ ${{inputs.pre_release}} != "true" ]; then
              last_released_version=$(curl -s "https://registry.hub.docker.com/v2/repositories/registry.invalid/ketos/ketos/tags?page_size=100" | jq -r '.results[].name' | grep -v '^base-' | grep -vE '\-(amd64|arm64)$' | grep -v 'latest' | sort -V | tail -n 1)
              echo "Latest main release version: $last_released_version"
            fi
          elif [ ${{inputs.pre_release}} == "true" ]; then
            released_versions=$(curl -s "https://registry.hub.docker.com/v2/repositories/registry.invalid/ketos/ketos/tags?page_size=100" | jq -r '.results[].name' | grep -v '^base-' | grep -vE '\-(amd64|arm64)$' || true)
            version="$(printf '%s\n' "$released_versions" | uv run ./scripts/ci/ketos_pre_release_tag.py "$version" -)"
            echo "Main pre-release version to be released: $version"
          else
            last_released_version=$(curl -s "https://registry.hub.docker.com/v2/repositories/registry.invalid/ketos/ketos/tags?page_size=100" | jq -r '.results[].name' | grep -v '^base-' | grep -vE '\-(amd64|arm64)$' | grep -v 'latest' | sort -V | tail -n 1)
            echo "Latest main release version: $last_released_version"
          fi

          # Skip check only applies to main image, not backend/frontend which are separate images
          if [ "$version" = "$last_released_version" ] && [[ "${{ inputs.release_type }}" != "main-backend" ]] && [[ "${{ inputs.release_type }}" != "main-frontend" ]]; then
            echo "Main docker version $version is already released. Skipping release."
            echo skipped=true >> $GITHUB_OUTPUT
            exit 0
          else
            echo version=$version >> $GITHUB_OUTPUT
            echo skipped=false >> $GITHUB_OUTPUT
          fi

  build-base:
    name: Build Base Package
    needs: [determine-base-version]
    if: ${{ inputs.release_type == 'base' && needs.determine-base-version.outputs.skipped == 'false' }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: [Ketos-runner]
          - arch: arm64
            runner:
              [self-hosted, linux, ARM64, ketos-local-arm64-40gb-ephemeral]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Set tags
        id: tags
        run: |
          version="${{ needs.determine-base-version.outputs.version }}"
          echo "docker_tags=registry.invalid/ketos/ketos:base-${version}-${{ matrix.arch }}" >> $GITHUB_OUTPUT
          echo "ghcr_tags=registry.invalid/ketos/ketos:base-${version}-${{ matrix.arch }}" >> $GITHUB_OUTPUT

      - name: Docker cleanup
        run: |
          docker system prune -af --volumes || true
          docker buildx prune -af || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.TEMP_GHCR_TOKEN}}

      - name: Build and push to Docker Hub
        id: oci_build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false # external publish disabled; immutable gate required
          file: ./docker/build_and_push_base.Dockerfile
          tags: ${{ steps.tags.outputs.docker_tags }}
          platforms: linux/${{ matrix.arch }}
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record immutable OCI subject
        env:
          ARCH: ${{ matrix.arch }}
          IMAGE_DIGEST: ${{ steps.oci_build.outputs.digest }}
          IMAGE_TAG: ${{ steps.tags.outputs.docker_tags }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          set -euo pipefail
          printf '%s' "$IMAGE_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
          IMAGE_NAME="${IMAGE_TAG%:*}"
          printf '{"arch":"%s","release_type":"%s","subject":"%s@%s"}\n' \
            "$ARCH" "$RELEASE_TYPE" "$IMAGE_NAME" "$IMAGE_DIGEST" \
            > "oci-subject-${RELEASE_TYPE}-${ARCH}.json"

      - name: Upload immutable OCI subject
        uses: actions/upload-artifact@v7
        with:
          name: oci-subject-${{ inputs.release_type }}-${{ matrix.arch }}
          path: oci-subject-${{ inputs.release_type }}-${{ matrix.arch }}.json

      - name: Build and push to GitHub Container Registry
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false # external publish disabled; immutable gate required
          file: ./docker/build_and_push_base.Dockerfile
          tags: ${{ steps.tags.outputs.ghcr_tags }}
          platforms: linux/${{ matrix.arch }}
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-main:
    name: Build Main Package
    needs: [determine-main-version]
    if: ${{ inputs.release_type == 'main' && needs.determine-main-version.outputs.skipped == 'false' }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: [Ketos-runner]
          - arch: arm64
            runner:
              [self-hosted, linux, ARM64, ketos-local-arm64-40gb-ephemeral]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Set tags
        id: tags
        run: |
          version="${{ needs.determine-main-version.outputs.version }}"
          echo "docker_tags=registry.invalid/ketos/ketos:${version}-${{ matrix.arch }}" >> $GITHUB_OUTPUT
          echo "ghcr_tags=registry.invalid/ketos/ketos:${version}-${{ matrix.arch }}" >> $GITHUB_OUTPUT

      - name: Docker cleanup
        run: |
          docker system prune -af --volumes || true
          docker buildx prune -af || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.TEMP_GHCR_TOKEN}}

      - name: Build and push to Docker Hub
        id: oci_build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false # external publish disabled; immutable gate required
          file: ./docker/build_and_push.Dockerfile
          tags: ${{ steps.tags.outputs.docker_tags }}
          platforms: linux/${{ matrix.arch }}
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record immutable OCI subject
        env:
          ARCH: ${{ matrix.arch }}
          IMAGE_DIGEST: ${{ steps.oci_build.outputs.digest }}
          IMAGE_TAG: ${{ steps.tags.outputs.docker_tags }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          set -euo pipefail
          printf '%s' "$IMAGE_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
          IMAGE_NAME="${IMAGE_TAG%:*}"
          printf '{"arch":"%s","release_type":"%s","subject":"%s@%s"}\n' \
            "$ARCH" "$RELEASE_TYPE" "$IMAGE_NAME" "$IMAGE_DIGEST" \
            > "oci-subject-${RELEASE_TYPE}-${ARCH}.json"

      - name: Upload immutable OCI subject
        uses: actions/upload-artifact@v7
        with:
          name: oci-subject-${{ inputs.release_type }}-${{ matrix.arch }}
          path: oci-subject-${{ inputs.release_type }}-${{ matrix.arch }}.json

      - name: Build and push to GitHub Container Registry
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false # external publish disabled; immutable gate required
          file: ./docker/build_and_push.Dockerfile
          tags: ${{ steps.tags.outputs.ghcr_tags }}
          platforms: linux/${{ matrix.arch }}
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-main-backend:
    name: Build Main Backend Package
    needs: [determine-main-version]
    if: ${{ inputs.release_type == 'main-backend' && needs.determine-main-version.outputs.skipped == 'false' }}
    strategy:
      matrix:
        include:
          - arch: amd64
