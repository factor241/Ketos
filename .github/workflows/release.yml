name: Ketos Release
run-name: Ketos Release by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to release from. This is the tag that contains the source code for the release."
        required: true
        type: string
      release_package_base:
        description: "Release Ketos Base"
        required: true
        type: boolean
        default: false
      release_package_main:
        description: "Release Ketos"
        required: true
        type: boolean
        default: false
      release_kfx:
        description: "Release KFX package (manually triggered)"
        required: false
        type: boolean
        default: false
      release_sdk:
        description: "Release ketos-sdk package (required when releasing KFX)"
        required: false
        type: boolean
        default: false
      release_bundles:
        description: "Release every src/bundles/* package (required when releasing main, since main pins exact bundle versions)"
        required: false
        type: boolean
        default: false
      build_docker_base:
        description: "Build Docker Image for Ketos Base"
        required: true
        type: boolean
        default: false
      build_docker_main:
        description: "Build Docker Image for Ketos"
        required: true
        type: boolean
        default: false
      pre_release:
        description: "Pre-release"
        required: false
        type: boolean
        default: false
      create_release:
        description: "Whether to create a gh release"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Dry run mode - disables all pushes to external services (PyPI, Docker, GitHub releases)"
        required: false
        type: boolean
        default: true
      run_pip_check:
        description: "Whether to run pip check - ONLY SET TO FALSE ONCE YOU HAVE ALREADY ATTEMPTED AND FAILED A RUN THEN MADE SURE DEPS DO NOT CAUSE FAILURES"
        required: false
        type: boolean
        default: true

jobs:
  echo-inputs:
    name: Echo Workflow Inputs
    runs-on: ubuntu-latest
    steps:
      - name: Echo workflow inputs
        run: |
          echo "release_tag: ${{ inputs.release_tag }}"
          echo "release_package_base: ${{ inputs.release_package_base }}"
          echo "release_package_main: ${{ inputs.release_package_main }}"
          echo "release_kfx: ${{ inputs.release_kfx }}"
          echo "release_sdk: ${{ inputs.release_sdk }}"
          echo "release_bundles: ${{ inputs.release_bundles }}"
          echo "build_docker_base: ${{ inputs.build_docker_base }}"
          echo "build_docker_main: ${{ inputs.build_docker_main }}"
          echo "pre_release: ${{ inputs.pre_release }}"
          echo "create_release: ${{ inputs.create_release }}"
          echo "dry_run: ${{ inputs.dry_run }}"

  validate-tag:
    name: Validate Tag Input
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Fetch all history - required for tags (?)
      - name: Validate that input is a tag, not a branch
        run: |
          # Check if the input exists as a tag
          if ! git tag -l | grep -q "^${{ inputs.release_tag }}$"; then
            echo "Error: '${{ inputs.release_tag }}' is not a valid tag."
            echo "Available tags:"
            git tag -l | head -20
            exit 1
          fi

          # Check if the input also exists as a branch (warn if so, but don't fail)
          if git branch -r | grep -q "origin/${{ inputs.release_tag }}$"; then
            echo "Tag '${{ inputs.release_tag }}' also exists as a branch. Exiting out of caution."
            exit 1
          fi

          echo "Validated: '${{ inputs.release_tag }}' is a valid tag."

      - name: Bind release tag to approved workflow commit
        run: |
          release_sha=$(git rev-parse "${{ inputs.release_tag }}^{commit}")
          if [ "$release_sha" != "$GITHUB_SHA" ]; then
            echo "Release tag resolves to $release_sha, but approved workflow commit is $GITHUB_SHA."
            exit 1
          fi
          echo "Release tag is bound to approved commit $GITHUB_SHA."

  validate-tag-format:
    name: Validate Tag Format and Check for Duplicates
    runs-on: ubuntu-latest
    needs: [validate-tag]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate Tag Has v Prefix
        run: |
          TAG="${{ inputs.release_tag }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Error: Tag must start with 'v' and follow semver format (v1.2.3)"
            echo "   Got: $TAG"
            echo ""
            echo "This is required to ensure GitHub's generateReleaseNotes uses the correct base comparison."
            exit 1
          fi
          echo "✅ Tag format is valid: $TAG"

      - name: Check for Duplicate Tag Without v Prefix
        run: |
          TAG="${{ inputs.release_tag }}"
          TAG_WITHOUT_V="${TAG#v}"

          if git rev-parse "$TAG_WITHOUT_V" >/dev/null 2>&1; then
            echo "❌ Error: Duplicate tag without 'v' prefix exists: $TAG_WITHOUT_V"
            echo "   This will cause release notes to use the wrong base comparison."
            echo ""
            echo "   The tag '$TAG_WITHOUT_V' points to commit: $(git rev-parse --short $TAG_WITHOUT_V)"
            echo "   The tag '$TAG' points to commit: $(git rev-parse --short $TAG)"
            echo ""
            echo "   To fix this, delete the duplicate tag:"
            echo "   git push origin :refs/tags/$TAG_WITHOUT_V"
            exit 1
          fi
          echo "✅ No duplicate tag found"

  validate-dependencies:
    name: Validate Release Dependencies
    runs-on: ubuntu-latest
    if: ${{ inputs.release_package_base || inputs.release_package_main || inputs.release_kfx || inputs.release_sdk || inputs.build_docker_base || inputs.build_docker_main }}
    needs: [validate-tag]
    steps:
      - name: Validate that build-base is enabled if build-main is enabled
        run: |
          if [ "${{ inputs.release_package_main }}" = "true" ] && [ "${{ inputs.release_package_base }}" = "false" ]; then
            echo "Error: Cannot release Ketos Main without releasing Ketos Base."
            echo "Please enable 'release_package_base' or disable 'release_package_main'."
            exit 1
          fi

          if [ "${{ inputs.release_kfx }}" = "true" ] && [ "${{ inputs.release_sdk }}" = "false" ]; then
            echo "Error: Cannot release KFX without releasing ketos-sdk."
            echo "KFX depends on ketos-sdk. Please enable 'release_sdk' or disable 'release_kfx'."
            exit 1
          fi

          if [ "${{ inputs.release_package_main }}" = "true" ] && [ "${{ inputs.release_bundles }}" = "false" ]; then
            echo "Error: Cannot release Ketos Main without releasing bundles."
            echo "Ketos Main pins exact bundle versions (kfx-arxiv, kfx-duckduckgo, ...). Please enable 'release_bundles' or disable 'release_package_main'."
            exit 1
          fi

          echo "✅ Release dependencies validated successfully."

  determine-rc-number:
    name: Determine Shared RC Number
    needs: [validate-tag, validate-dependencies]
    runs-on: ubuntu-latest
    outputs:
      rc_number: ${{ steps.rc.outputs.rc_number || steps.stable.outputs.rc_number }}
    steps:
      - name: Use stable RC number
        id: stable
        if: ${{ !inputs.pre_release }}
        run: |
          echo "rc_number=0" >> "$GITHUB_OUTPUT"
          echo "Not a pre-release; shared rc number is 0."

      - name: Checkout code
        if: ${{ inputs.pre_release }}
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}

      - name: Setup Environment
        if: ${{ inputs.pre_release }}
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"
          prune-cache: false

      - name: Determine shared pre-release RC number
        id: rc
        if: ${{ inputs.pre_release }}
        shell: bash
        run: |
          set -euo pipefail

          read_pyproject_version() {
            python3 - "$1" <<'PY'
          import pathlib
          import sys
          import tomllib

          data = tomllib.loads(pathlib.Path(sys.argv[1]).read_text())
          print(data["project"]["version"])
          PY
          }

          fetch_pypi_versions() {
            local package_name="$1"
            local output_file="$2"
            local response_file
            response_file="$(mktemp)"
            local status
            status=$(curl --retry 3 --retry-delay 2 --retry-connrefused -sS -o "$response_file" -w "%{http_code}" "https://pypi.org/pypi/${package_name}/json")
            if [ "$status" = "404" ]; then
              : > "$output_file"
              return
            fi
            if [ "$status" != "200" ]; then
              echo "Failed to fetch PyPI releases for ${package_name}: HTTP ${status}" >&2
              cat "$response_file" >&2 || true
              exit 1
            fi
            jq -r '.releases | keys[]' "$response_file" > "$output_file"
          }

          fetch_docker_tags() {
            local repository="$1"
            local output_file="$2"
            local response_file
            response_file="$(mktemp)"
            local status
            status=$(curl --retry 3 --retry-delay 2 --retry-connrefused -sS -o "$response_file" -w "%{http_code}" "https://registry.hub.docker.com/v2/repositories/${repository}/tags?page_size=100")
            if [ "$status" != "200" ]; then
              echo "Failed to fetch Docker tags for ${repository}: HTTP ${status}" >&2
              cat "$response_file" >&2 || true
              exit 1
            fi
            jq -r '.results[].name' "$response_file" > "$output_file"
          }

          max_rc=0
          consider_versions() {
            local label="$1"
            local base_version="$2"
            local versions_file="$3"
            local rc_number
            rc_number=$(uv run ./scripts/ci/ketos_pre_release_tag.py "$base_version" --print-rc-number - < "$versions_file")
            echo "${label}: next rc number for ${base_version} is ${rc_number}"
            if [ "$rc_number" -gt "$max_rc" ]; then
              max_rc="$rc_number"
            fi
          }

          tmp_dir="$(mktemp -d)"

          if [ "${{ inputs.release_package_main }}" = "true" ]; then
            version="$(read_pyproject_version pyproject.toml)"
            fetch_pypi_versions "ketos" "$tmp_dir/ketos-pypi.txt"
            consider_versions "PyPI ketos" "$version" "$tmp_dir/ketos-pypi.txt"
          fi

          if [ "${{ inputs.release_package_base }}" = "true" ]; then
            version="$(read_pyproject_version src/backend/base/pyproject.toml)"
            fetch_pypi_versions "ketos-base" "$tmp_dir/ketos-base-pypi.txt"
            consider_versions "PyPI ketos-base" "$version" "$tmp_dir/ketos-base-pypi.txt"
          fi

          if [ "${{ inputs.release_kfx }}" = "true" ]; then
            version="$(read_pyproject_version src/kfx/pyproject.toml)"
            fetch_pypi_versions "kfx" "$tmp_dir/kfx-pypi.txt"
            consider_versions "PyPI kfx" "$version" "$tmp_dir/kfx-pypi.txt"
          fi

          if [ "${{ inputs.release_sdk || inputs.release_kfx }}" = "true" ]; then
            version="$(read_pyproject_version src/sdk/pyproject.toml)"
            fetch_pypi_versions "ketos-sdk" "$tmp_dir/ketos-sdk-pypi.txt"
            consider_versions "PyPI ketos-sdk" "$version" "$tmp_dir/ketos-sdk-pypi.txt"
          fi

          if [ "${{ inputs.release_bundles }}" = "true" ]; then
            for pyproject in src/bundles/*/pyproject.toml; do
              package_name=$(python3 - "$pyproject" <<'PY'
          import pathlib
          import sys
          import tomllib

          data = tomllib.loads(pathlib.Path(sys.argv[1]).read_text())
          print(data["project"]["name"])
          PY
          )
              version="$(read_pyproject_version "$pyproject")"
              output_file="$tmp_dir/${package_name}-pypi.txt"
              fetch_pypi_versions "$package_name" "$output_file"
              consider_versions "PyPI ${package_name}" "$version" "$output_file"
            done
          fi

          if [ "${{ inputs.build_docker_main }}" = "true" ]; then
            version="$(read_pyproject_version pyproject.toml)"
            fetch_docker_tags "registry.invalid/ketos/ketos" "$tmp_dir/ketos-docker.txt"
            grep -v '^base-' "$tmp_dir/ketos-docker.txt" | grep -vE '\-(amd64|arm64)$' > "$tmp_dir/ketos-docker-release-tags.txt" || true
            consider_versions "Docker registry.invalid/ketos/ketos" "$version" "$tmp_dir/ketos-docker-release-tags.txt"
          fi

          if [ "${{ inputs.build_docker_base }}" = "true" ]; then
            version="$(read_pyproject_version src/backend/base/pyproject.toml)"
            fetch_docker_tags "registry.invalid/ketos/ketos" "$tmp_dir/ketos-base-docker.txt"
            grep -E '^base-' "$tmp_dir/ketos-base-docker.txt" | grep -vE '\-(amd64|arm64)$' | sed 's/^base-//' > "$tmp_dir/ketos-base-docker-release-tags.txt" || true
            consider_versions "Docker registry.invalid/ketos/ketos base" "$version" "$tmp_dir/ketos-base-docker-release-tags.txt"
          fi

          echo "Shared pre-release rc number: ${max_rc}"
          echo "rc_number=${max_rc}" >> "$GITHUB_OUTPUT"

  determine-base-version:
    name: Determine Base Version
    needs: [validate-tag, validate-dependencies, determine-rc-number]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      skipped: ${{ steps.version.outputs.skipped }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}

      - name: Setup Environment
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"
          prune-cache: false

      - name: Install the project
        run: uv sync

      - name: Determine version
        id: version
        run: |
          version=$(python3 -c "
          import tomllib, pathlib
          data = tomllib.loads(pathlib.Path('src/backend/base/pyproject.toml').read_text())
          print(data['project']['version'])
          ")
          echo "Base version from pyproject.toml: $version"

          if [ ${{inputs.pre_release}} == "true" ]; then
            rc_number="${{ needs.determine-rc-number.outputs.rc_number }}"
            version="$(uv run ./scripts/ci/ketos_pre_release_tag.py "$version" --rc-number "$rc_number")"
            echo "Shared release candidate number: rc$rc_number"
            echo "Base pre-release version to be released: $version"
          else
            last_released_version=$(curl -s "https://pypi.org/pypi/ketos-base/json" | jq -r '.releases | keys | .[]' | grep -vE '(a|b|rc|dev|alpha|beta)' | sort -V | tail -n 1)
            echo "Latest base release version: $last_released_version"
          fi

          if [ "$version" = "$last_released_version" ] && [ "${{ inputs.release_package_base }}" = "true" ]; then
            echo "Base pypi version $version is already released. Skipping release."
            echo skipped=true >> $GITHUB_OUTPUT
            exit 1
          else
            echo version=$version >> $GITHUB_OUTPUT
            echo skipped=false >> $GITHUB_OUTPUT
          fi

  determine-main-version:
    name: Determine Main Version
    needs: [validate-tag, validate-dependencies, determine-rc-number]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      skipped: ${{ steps.version.outputs.skipped }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}

      - name: Setup Environment
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"
          prune-cache: false

      - name: Install the project
        run: uv sync

      - name: Determine version
        id: version
        run: |
          version=$(uv tree | grep -E '^ketos(-nightly)?[[:space:]]' | awk '{print $2}' | sed 's/^v//')
          echo "Main version from pyproject.toml: $version"

          if [ ${{inputs.pre_release}} == "true" ]; then
            rc_number="${{ needs.determine-rc-number.outputs.rc_number }}"
            version="$(uv run ./scripts/ci/ketos_pre_release_tag.py "$version" --rc-number "$rc_number")"
            echo "Shared release candidate number: rc$rc_number"
            echo "Main pre-release version to be released: $version"
          else
            last_released_version=$(curl -s "https://pypi.org/pypi/ketos/json" | jq -r '.releases | keys | .[]' | grep -vE '(a|b|rc|dev|alpha|beta)' | sort -V | tail -n 1)
            echo "Latest main release version: $last_released_version"
          fi

          if [ "$version" = "$last_released_version" ] && [ "${{ inputs.release_package_main }}" = "true" ]; then
            echo "Main pypi version $version is already released. Skipping release."
            echo skipped=true >> $GITHUB_OUTPUT
            exit 1
          else
            echo version=$version >> $GITHUB_OUTPUT
            echo skipped=false >> $GITHUB_OUTPUT
          fi

  determine-kfx-version:
    name: Determine KFX Version
    needs: [validate-tag, validate-dependencies, determine-rc-number]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      skipped: ${{ steps.version.outputs.skipped }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}

      - name: Setup Environment
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"
          prune-cache: false

      - name: Install KFX dependencies
        run: uv sync --dev --package kfx

      - name: Determine version
        id: version
        run: |
          version=$(uv tree | grep 'kfx' | awk '{print $3}' | sed 's/^v//' | head -n 2 | xargs)
          echo "KFX version from pyproject.toml: $version"

          if [ ${{inputs.pre_release}} == "true" ]; then
            rc_number="${{ needs.determine-rc-number.outputs.rc_number }}"
            version="$(uv run ./scripts/ci/ketos_pre_release_tag.py "$version" --rc-number "$rc_number")"
            echo "Shared release candidate number: rc$rc_number"
            echo "KFX pre-release version to be released: $version"
          else
            last_released_version=$(curl -s "https://pypi.org/pypi/kfx/json" | jq -r '.releases | keys | .[]' | grep -vE '(a|b|rc|dev|alpha|beta)' | sort -V | tail -n 1)
            echo "Latest KFX release version: $last_released_version"
          fi

          if [ "$version" = "$last_released_version" ]; then
            echo "KFX pypi version $version is already released. Skipping release."
            echo skipped=true >> $GITHUB_OUTPUT
            exit 1
          else
            echo version=$version >> $GITHUB_OUTPUT
            echo skipped=false >> $GITHUB_OUTPUT
          fi

  determine-sdk-version:
    name: Determine SDK Version
    needs: [validate-tag, validate-dependencies, determine-rc-number]
    if: ${{ inputs.release_sdk || inputs.release_kfx }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      skipped: ${{ steps.version.outputs.skipped }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}

      - name: Setup Environment
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"
          prune-cache: false

      - name: Install SDK dependencies
        run: uv sync --dev --package ketos-sdk

      - name: Determine version
        id: version
        run: |
          version=$(python3 -c "
          import tomllib, pathlib
          data = tomllib.loads(pathlib.Path('src/sdk/pyproject.toml').read_text())
          print(data['project']['version'])
          ")
          echo "SDK version from pyproject.toml: $version"

          # Check if ketos-sdk exists on PyPI (may be first release)
          pypi_response=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/ketos-sdk/json")
          if [ "$pypi_response" = "404" ]; then
            echo "ketos-sdk has never been published to PyPI. This will be the first release."
            last_released_version=""
            if [ ${{inputs.pre_release}} == "true" ]; then
              rc_number="${{ needs.determine-rc-number.outputs.rc_number }}"
              version="$(uv run ./scripts/ci/ketos_pre_release_tag.py "$version" --rc-number "$rc_number")"
              echo "Shared release candidate number: rc$rc_number"
              echo "SDK pre-release version to be released: $version"
            fi
          else
            if [ ${{inputs.pre_release}} == "true" ]; then
              rc_number="${{ needs.determine-rc-number.outputs.rc_number }}"
              version="$(uv run ./scripts/ci/ketos_pre_release_tag.py "$version" --rc-number "$rc_number")"
              echo "Shared release candidate number: rc$rc_number"
              echo "SDK pre-release version to be released: $version"
            else
              last_released_version=$(curl -s "https://pypi.org/pypi/ketos-sdk/json" | jq -r '.releases | keys | .[]' | grep -vE '(a|b|rc|dev|alpha|beta)' | sort -V | tail -n 1)
              echo "Latest SDK release version: $last_released_version"
            fi
          fi

          if [ "$version" = "$last_released_version" ]; then
            echo "SDK pypi version $version is already released. Skipping release."
            echo skipped=true >> $GITHUB_OUTPUT
            exit 1
          else
            echo version=$version >> $GITHUB_OUTPUT
            echo skipped=false >> $GITHUB_OUTPUT
          fi

  ci:
    name: CI
    needs: [validate-tag, validate-dependencies]
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.release_tag }}
      python-versions: "['3.10', '3.11', '3.12', '3.13', '3.14']"
      frontend-tests-folder: "tests"
      release: true
      run-all-tests: true
      runs-on: ubuntu-latest
    secrets: inherit

  build-sdk:
    name: Build ketos-sdk
    needs: [determine-sdk-version]
    if: ${{ needs.determine-sdk-version.outputs.skipped == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
      - name: Setup Environment
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"
          prune-cache: false
      - name: Set version for pre-release
        if: ${{ inputs.pre_release }}
        run: |
          VERSION="${{ needs.determine-sdk-version.outputs.version }}"
          echo "Setting SDK pre-release version to: $VERSION"
          cd src/sdk

          # Update version in SDK pyproject.toml
          sed -i.bak "s/^version = .*/version = \"$VERSION\"/" pyproject.toml

          # Verify the change
          echo "Updated pyproject.toml version:"
          grep "^version" pyproject.toml
      - name: Build project for distribution
        run: make sdk_build
      - name: Verify built version
        run: |
          EXPECTED_VERSION="${{ needs.determine-sdk-version.outputs.version }}"
          WHEEL_FILE=$(ls src/sdk/dist/*.whl)
          echo "Built wheel: $WHEEL_FILE"

          NORMALIZED_VERSION=$(echo "$EXPECTED_VERSION" | sed 's/\.rc/rc/g; s/\.a/a/g; s/\.b/b/g; s/\.dev/dev/g')
          echo "Expected version: $EXPECTED_VERSION"
          echo "Normalized for wheel: $NORMALIZED_VERSION"

          if [[ ! "$WHEEL_FILE" =~ $NORMALIZED_VERSION ]]; then
            echo "❌ Error: Wheel version doesn't match expected version"
            echo "Expected: $EXPECTED_VERSION (normalized: $NORMALIZED_VERSION)"
            echo "Wheel file: $WHEEL_FILE"
            exit 1
          fi
          echo "✅ Version verified: $EXPECTED_VERSION"
      - name: Test SDK import
        run: |
          cd src/sdk
          uv venv test-env --seed
          uv pip install --python ./test-env/bin/python dist/*.whl
          EXPECTED_VERSION="${{ needs.determine-sdk-version.outputs.version }}"
          # importlib.metadata returns the PEP 440 canonical form, so normalize
          # the expected version the same way the wheel filename check does.
          NORMALIZED_VERSION=$(echo "$EXPECTED_VERSION" | sed 's/\.rc/rc/g; s/\.a/a/g; s/\.b/b/g; s/\.dev/dev/g')
          ./test-env/bin/python -c "from importlib.metadata import version; import ketos_sdk; installed_version = version('ketos-sdk'); print(f'ketos-sdk {installed_version} imported successfully'); assert installed_version == '$NORMALIZED_VERSION', f'Installed version {installed_version} does not match expected version $NORMALIZED_VERSION'"
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-sdk
          path: src/sdk/dist

  build-kfx:
    name: Build KFX
    needs: [determine-kfx-version, determine-sdk-version, build-sdk]
    if: |
      always() &&
      !cancelled() &&
      needs.determine-kfx-version.result == 'success' &&
      needs.determine-kfx-version.outputs.skipped == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
      - name: Setup Environment
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"
          prune-cache: false
      - name: Download SDK artifact
        if: needs.build-sdk.result == 'success'
        uses: actions/download-artifact@v7
        with:
          name: dist-sdk
          path: ./sdk-dist
      - name: Install KFX dependencies
        run: uv sync --dev --package kfx
      - name: Set version for pre-release
        if: ${{ inputs.pre_release }}
        run: |
          VERSION="${{ needs.determine-kfx-version.outputs.version }}"
          echo "Setting pre-release version to: $VERSION"
          cd src/kfx

          # Update version in kfx pyproject.toml
          sed -i.bak "s/^version = .*/version = \"$VERSION\"/" pyproject.toml

          # Verify the change
          echo "Updated pyproject.toml version:"
          grep "^version" pyproject.toml
      - name: Update ketos-sdk dependency for pre-release
        if: ${{ inputs.pre_release && needs.build-sdk.result == 'success' }}
        run: |
          SDK_VERSION="${{ needs.determine-sdk-version.outputs.version }}"
          echo "Updating ketos-sdk dependency to allow pre-release version: $SDK_VERSION"
          cd src/kfx

          # Extract current ketos-sdk constraint from pyproject.toml
          CURRENT_CONSTRAINT=$(grep -E '^\s*"ketos-sdk' pyproject.toml | head -1)
          echo "Current constraint: $CURRENT_CONSTRAINT"

          # Create new constraint using the next major derived from SDK_VERSION
          SDK_BASE_VERSION=$(echo "$SDK_VERSION" | sed 's/[^0-9.].*$//')
          SDK_MAJOR=$(echo "$SDK_BASE_VERSION" | cut -d. -f1)
          NEXT_MAJOR=$((SDK_MAJOR + 1))
          NEW_CONSTRAINT="\"ketos-sdk>=$SDK_VERSION,<$NEXT_MAJOR.dev0\""

          echo "New constraint: $NEW_CONSTRAINT"

          # Replace the constraint
          sed -i.bak "s|\"ketos-sdk[^\"]*\"|$NEW_CONSTRAINT|" pyproject.toml

          # Verify the change
          echo "Updated ketos-sdk dependency:"
          grep "ketos-sdk" pyproject.toml
      - name: Build project for distribution
        run: |
          cd src/kfx
          rm -rf dist/
          uv build --out-dir dist
      - name: Verify built version
        run: |
          EXPECTED_VERSION="${{ needs.determine-kfx-version.outputs.version }}"
          WHEEL_FILE=$(ls src/kfx/dist/*.whl)
          echo "Built wheel: $WHEEL_FILE"

          NORMALIZED_VERSION=$(echo "$EXPECTED_VERSION" | sed 's/\.rc/rc/g; s/\.a/a/g; s/\.b/b/g; s/\.dev/dev/g')
          echo "Expected version: $EXPECTED_VERSION"
          echo "Normalized for wheel: $NORMALIZED_VERSION"

          if [[ ! "$WHEEL_FILE" =~ $NORMALIZED_VERSION ]]; then
            echo "❌ Error: Wheel version doesn't match expected version"
            echo "Expected: $EXPECTED_VERSION (normalized: $NORMALIZED_VERSION)"
            echo "Wheel file: $WHEEL_FILE"
            exit 1
          fi
          echo "✅ Version verified: $EXPECTED_VERSION"
      - name: Test CLI
        run: |
          cd src/kfx
          # Use a clean venv and install both SDK and KFX wheels together
          # so uv can resolve the local SDK dependency without falling back to PyPI.
          uv venv test-env --seed
          if [ -d "../../sdk-dist" ]; then
            SDK_WHEEL=$(find ../../sdk-dist -name "*.whl" -type f | head -1)
            uv pip install --python ./test-env/bin/python --force-reinstall "$SDK_WHEEL" dist/*.whl
          else
            uv pip install --python ./test-env/bin/python --force-reinstall dist/*.whl
          fi
          ./test-env/bin/kfx --help
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-kfx
          path: src/kfx/dist

  build-base:
    name: Build Ketos Base
    needs: [build-kfx, build-sdk, determine-base-version, determine-kfx-version]
    if: |
      always() &&
      !cancelled() &&
      inputs.release_package_base &&
      needs.determine-base-version.result == 'success' &&
      needs.determine-base-version.outputs.skipped == 'false' &&
      needs.build-kfx.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
      - name: Setup Environment
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"
          prune-cache: false
      - name: Download KFX artifact
        uses: actions/download-artifact@v7
        with:
          name: dist-kfx
          path: ./kfx-dist
      - name: Download SDK artifact
        if: needs.build-sdk.result == 'success'
        uses: actions/download-artifact@v7
        with:
          name: dist-sdk
          path: ./sdk-dist
      - name: Install dependencies with local KFX and SDK wheels
        run: |
          # Create virtual environment
          uv venv
          # Install using pip with local wheel directories as find-links
          FIND_LINKS="--find-links ./kfx-dist"
          if [ -d "./sdk-dist" ]; then
            FIND_LINKS="$FIND_LINKS --find-links ./sdk-dist"
          fi
          uv pip install $FIND_LINKS --prerelease=allow -e src/backend/base
      - name: Check for dependency incompatibility
        if: ${{ inputs.run_pip_check }}
        run: uv pip check
      - name: Set version for pre-release
        if: ${{ inputs.pre_release }}
        run: |
          VERSION="${{ needs.determine-base-version.outputs.version }}"
          echo "Setting pre-release version to: $VERSION"
          cd src/backend/base

          # Update version in pyproject.toml
          sed -i.bak "s/^version = .*/version = \"$VERSION\"/" pyproject.toml

          # Verify the change
          echo "Updated pyproject.toml version:"
          grep "^version" pyproject.toml
      - name: Update kfx dependency for pre-release
        if: ${{ inputs.pre_release }}
        run: |
          KFX_VERSION="${{ needs.determine-kfx-version.outputs.version }}"
          echo "Updating kfx dependency to allow pre-release version: $KFX_VERSION"
          cd src/backend/base

          # Extract current kfx constraint from pyproject.toml
          CURRENT_CONSTRAINT=$(grep -E '^\s*"kfx' pyproject.toml | head -1)
          echo "Current constraint: $CURRENT_CONSTRAINT"

          # Extract the major.minor version (e.g., "1.10" from "~=1.10.0", or from the
          # lower bound of the range form ">=1.10.0,<1.11.dev0"). Anchor to the FIRST
          # version in the line so a greedy match can't pick up the range's upper bound.
          MAJOR_MINOR=$(echo "$CURRENT_CONSTRAINT" | sed -E 's/^[^0-9]*([0-9]+\.[0-9]+).*/\1/')
          MAJOR=${MAJOR_MINOR%.*}
          MINOR=${MAJOR_MINOR#*.}
          NEXT_MINOR=$((MINOR + 1))

          # Create new constraint: >=KFX_VERSION,<MAJOR.(MINOR+1).dev0
          NEW_CONSTRAINT="\"kfx>=$KFX_VERSION,<$MAJOR.$NEXT_MINOR.dev0\""

          echo "New constraint: $NEW_CONSTRAINT"

          # Replace the constraint
          sed -i.bak "s|\"kfx[^\"]*\"|$NEW_CONSTRAINT|" pyproject.toml

          # Verify the change
          echo "Updated kfx dependency:"
          grep "kfx" pyproject.toml
      - name: Build project for distribution
        run: make build base=true
      - name: Verify built version
        run: |
          EXPECTED_VERSION="${{ needs.determine-base-version.outputs.version }}"
          WHEEL_FILE=$(ls dist/*.whl 2>/dev/null || ls src/backend/base/dist/*.whl)
          echo "Built wheel: $WHEEL_FILE"

          NORMALIZED_VERSION=$(echo "$EXPECTED_VERSION" | sed 's/\.rc/rc/g; s/\.a/a/g; s/\.b/b/g; s/\.dev/dev/g')
          echo "Expected version: $EXPECTED_VERSION"
          echo "Normalized for wheel: $NORMALIZED_VERSION"

          if [[ ! "$WHEEL_FILE" =~ $NORMALIZED_VERSION ]]; then
            echo "❌ Error: Wheel version doesn't match expected version"
            echo "Expected: $EXPECTED_VERSION (normalized: $NORMALIZED_VERSION)"
            echo "Wheel file: $WHEEL_FILE"
            exit 1
          fi
          echo "✅ Version verified: $EXPECTED_VERSION"
      - name: Test CLI
        run: |
          # TODO: Unsure why the whl is not built in src/backend/base/dist
          mkdir src/backend/base/dist
          mv dist/*.whl src/backend/base/dist
          uv pip install src/backend/base/dist/*.whl
          uv run python -m ketos run --host localhost --port 7860 --backend-only &
          SERVER_PID=$!
          # Wait for the server to start
          timeout 120 bash -c 'until curl -f http://localhost:7860/api/v1/auto_login; do sleep 2; done' || (echo "Server did not start in time" && kill $SERVER_PID && exit 1)
          # Terminate the server
          kill $SERVER_PID || (echo "Failed to terminate the server" && exit 1)
          sleep 20 # give the server some time to terminate
          # Check if the server is still running
          if kill -0 $SERVER_PID 2>/dev/null; then
            echo "Failed to terminate the server"
            exit 0
          else
            echo "Server terminated successfully"
          fi

      # PyPI publishing moved to after cross-platform testing

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-base
          path: src/backend/base/dist

  build-main:
    name: Build Ketos Main
    needs:
      [
        build-base,
        build-kfx,
        build-sdk,
        determine-base-version,
        determine-main-version,
        determine-kfx-version,
      ]
    if: |
      always() &&
      !cancelled() &&
      inputs.release_package_main &&
      needs.determine-main-version.result == 'success' &&
      needs.determine-main-version.outputs.skipped == 'false' &&
      needs.build-base.result == 'success' &&
      needs.build-kfx.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
      - name: Setup Environment
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"
          prune-cache: false
      - name: Download KFX artifact
        uses: actions/download-artifact@v7
        with:
          name: dist-kfx
          path: ./kfx-dist
      - name: Download SDK artifact
        if: needs.build-sdk.result == 'success'
        uses: actions/download-artifact@v7
        with:
          name: dist-sdk
          path: ./sdk-dist
      - name: Download base artifact
        uses: actions/download-artifact@v7
        with:
          name: dist-base
          path: ./base-dist
      - name: Install dependencies with local wheels
        run: |
          # Create virtual environment
          uv venv
          # Install using pip with local wheel directories as find-links
          FIND_LINKS="--find-links ./kfx-dist --find-links ./base-dist"
          if [ -d "./sdk-dist" ]; then
            FIND_LINKS="$FIND_LINKS --find-links ./sdk-dist"
          fi
          uv pip install $FIND_LINKS --prerelease=allow -e .
      - name: Check for dependency incompatibility
        if: ${{ inputs.run_pip_check }}
        run: uv pip check
      - name: Set version for pre-release
        if: ${{ inputs.pre_release }}
        run: |
          VERSION="${{ needs.determine-main-version.outputs.version }}"
          echo "Setting main pre-release version to: $VERSION"

          # Update version in main pyproject.toml
          sed -i.bak "s/^version = .*/version = \"$VERSION\"/" pyproject.toml

          # Verify the change
          echo "Updated pyproject.toml version:"
          grep "^version" pyproject.toml
      - name: Update ketos-base dependency for pre-release
        if: ${{ inputs.pre_release }}
        run: |
          BASE_VERSION="${{ needs.determine-base-version.outputs.version }}"
          echo "Base version for pre-release: $BASE_VERSION"

          # Extract current ketos-base constraint from pyproject.toml
          CURRENT_CONSTRAINT=$(grep -E '^\s*"ketos-base' pyproject.toml | head -1)
          echo "Current constraint: $CURRENT_CONSTRAINT"

          # Extract the major.minor version (e.g., "0.8" from "~=0.8.0")
          MAJOR_MINOR=$(echo "$CURRENT_CONSTRAINT" | sed -E 's/.*[~>=<]+([0-9]+\.[0-9]+).*/\1/')
          NEXT_MAJOR=$((${MAJOR_MINOR%.*} + 1))

          # Create new constraint: >=BASE_VERSION,<NEXT_MAJOR.dev0 (preserve [complete] extra)
          NEW_CONSTRAINT="\"ketos-base[complete]>=$BASE_VERSION,<$NEXT_MAJOR.dev0\""

          echo "New constraint: $NEW_CONSTRAINT"

          # Replace the constraint
          sed -i.bak "s|\"ketos-base[^\"]*\"|$NEW_CONSTRAINT|" pyproject.toml

          # Verify the change
          echo "Updated dependency:"
          grep "ketos-base" pyproject.toml
      - name: Build project for pre-release distribution
        if: ${{ inputs.pre_release }}
        run: make build pre=true args="--no-sources"
      - name: Build project for distribution
        if: ${{ !inputs.pre_release }}
        run: make build main=true args="--no-sources"
      - name: Verify built version
        run: |
          EXPECTED_VERSION="${{ needs.determine-main-version.outputs.version }}"
          WHEEL_FILE=$(ls dist/*.whl)
          echo "Built wheel: $WHEEL_FILE"

          NORMALIZED_VERSION=$(echo "$EXPECTED_VERSION" | sed 's/\.rc/rc/g; s/\.a/a/g; s/\.b/b/g; s/\.dev/dev/g')
          echo "Expected version: $EXPECTED_VERSION"
          echo "Normalized for wheel: $NORMALIZED_VERSION"

          if [[ ! "$WHEEL_FILE" =~ $NORMALIZED_VERSION ]]; then
            echo "❌ Error: Wheel version doesn't match expected version"
            echo "Expected: $EXPECTED_VERSION (normalized: $NORMALIZED_VERSION)"
            echo "Wheel file: $WHEEL_FILE"
            exit 1
          fi
          echo "✅ Version verified: $EXPECTED_VERSION"
      - name: Test CLI
        run: |
          uv pip install dist/*.whl
          uv run python -m ketos run --host localhost --port 7860 --backend-only &
          SERVER_PID=$!
          # Wait for the server to start
          timeout 120 bash -c 'until curl -f http://localhost:7860/health_check; do sleep 2; done' || (echo "Server did not start in time" && kill $SERVER_PID && exit 1)
          # Terminate the server
          kill $SERVER_PID || (echo "Failed to terminate the server" && exit 1)
          sleep 20 # give the server some time to terminate
          # Check if the server is still running
          if kill -0 $SERVER_PID 2>/dev/null; then
            echo "Failed to terminate the server"
            exit 0
          else
            echo "Server terminated successfully"
          fi

      # PyPI publishing moved to after cross-platform testing

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-main
          path: dist

  build-bundles:
    name: Build Ketos Bundles
    needs: [build-kfx, determine-kfx-version, determine-rc-number]
    if: |
      always() &&
      !cancelled() &&
      inputs.release_bundles &&
      needs.build-kfx.result == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    outputs:
      bundles-found: ${{ steps.build.outputs.bundles-found }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
      - name: Setup Environment
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"
          prune-cache: false
      - name: Install the project
        run: uv sync
      - name: Set bundle versions for pre-release
        if: ${{ inputs.pre_release }}
        run: |
          RC_NUMBER="${{ needs.determine-rc-number.outputs.rc_number }}"
          echo "Setting bundle pre-release versions with shared rc number: rc$RC_NUMBER"
          for pyproject in src/bundles/*/pyproject.toml; do
            CURRENT_VERSION=$(python3 - "$pyproject" <<'PY'
          import pathlib
          import sys
          import tomllib

          data = tomllib.loads(pathlib.Path(sys.argv[1]).read_text())
          print(data["project"]["version"])
          PY
          )
            VERSION=$(uv run ./scripts/ci/ketos_pre_release_tag.py "$CURRENT_VERSION" --rc-number "$RC_NUMBER")
            sed -i.bak "0,/^version = /s|^version = .*|version = \"$VERSION\"|" "$pyproject"
            rm -f "${pyproject}.bak"
            grep "^version" "$pyproject" | sed "s|^|  ${pyproject}: |"
          done
      - name: Relax bundle kfx floor for pre-release
        if: ${{ inputs.pre_release }}
        run: |
          # Bundles floor kfx at the release line (e.g. kfx>=1.10.0). A pre-release
          # such as 1.10.0rc0 sorts BELOW 1.10.0 under PEP 440, so it fails that
          # floor and the cross-platform install test cannot resolve. Mirror what
          # build-base / build-main / build-kfx already do for pre-release: rewrite
          # the floor to the exact pre-release kfx version, preserving the bundle's
          # wide <2.0.0 BUNDLE_API cap. Stable source stays at >=1.10.0 -- only the
          # RC wheels are relaxed, at build time.
          KFX_VERSION="${{ needs.determine-kfx-version.outputs.version }}"
          echo "Relaxing bundle kfx floor to pre-release version: $KFX_VERSION"
          for pyproject in src/bundles/*/pyproject.toml; do
            sed -i.bak -E "s|\"kfx>=[^\"]*\"|\"kfx>=${KFX_VERSION},<2.0.0\"|" "$pyproject"
            rm -f "${pyproject}.bak"
            grep -E '"kfx>=' "$pyproject" | sed "s|^|  ${pyproject}: |"
          done
      - name: Build bundle distributions
        id: build
        run: |
          shopt -s nullglob
          bundles=(src/bundles/*/pyproject.toml)
          if [ ${#bundles[@]} -eq 0 ]; then
            echo "No bundles found under src/bundles/*/"
            echo "bundles-found=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          mkdir -p bundles-dist
          BUNDLES_DIST="$PWD/bundles-dist"
          for bundle_pyproject in "${bundles[@]}"; do
            bundle_dir=$(dirname "$bundle_pyproject")
            echo "Building wheel and sdist for $bundle_dir"
            (cd "$bundle_dir" && uv build --out-dir "$BUNDLES_DIST")
          done
          echo "bundles-found=1" >> $GITHUB_OUTPUT
          ls -la bundles-dist/
      - name: Upload bundles artifact
        if: steps.build.outputs.bundles-found == '1'
        uses: actions/upload-artifact@v7
        with:
          name: dist-bundles
          path: bundles-dist

  test-cross-platform:
    name: Test Cross-Platform Installation
    needs: [build-base, build-main, build-kfx, build-sdk, build-bundles]
    if: |
      always() &&
      !cancelled() &&
      (needs.build-base.result == 'success' || needs.build-main.result == 'success' || needs.build-kfx.result == 'success')
    uses: ./.github/workflows/cross-platform-test.yml
    with:
      base-artifact-name: "dist-base"
      main-artifact-name: "dist-main"
      kfx-artifact-name: "dist-kfx"
      sdk-artifact-name: ${{ needs.build-sdk.result == 'success' && 'dist-sdk' || '' }}
      bundles-artifact-name: ${{ needs.build-bundles.result == 'success' && needs.build-bundles.outputs.bundles-found == '1' && 'dist-bundles' || '' }}
      pre_release: ${{ inputs.pre_release }}

  publish-base:
    name: Publish Ketos Base to PyPI
    if: |
      always() &&
      !cancelled() &&
      inputs.release_package_base &&
      needs.build-base.result == 'success' &&
      needs.test-cross-platform.result == 'success' &&
      needs.ci.result == 'success' &&
      (needs.publish-kfx.result == 'success' || needs.publish-kfx.result == 'skipped')
    needs: [build-base, test-cross-platform, ci, publish-kfx]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Download base artifact
        uses: actions/download-artifact@v7
        with:
          name: dist-base
          path: src/backend/base/dist
      - name: Setup Environment
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
          python-version: "3.13"
      - name: Publish base to PyPI
        if: ${{ !inputs.dry_run }}
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
          KETOS_RELEASE_COMMIT: ${{ vars.KETOS_RELEASE_COMMIT }}
          KETOS_EXTERNAL_RELEASE: ${{ vars.KETOS_EXTERNAL_RELEASE }}
        run: |
          cd src/backend/base && uv run python "$GITHUB_WORKSPACE/scripts/ci/require_external_release.py" && uv publish dist/*.whl

  publish-bundles:
    name: Publish Bundles to PyPI
    needs: [build-bundles, test-cross-platform, ci, publish-kfx]
    if: |
      always() &&
      !cancelled() &&
      inputs.release_bundles &&
      needs.build-bundles.result == 'success' &&
      needs.build-bundles.outputs.bundles-found == '1' &&
      needs.test-cross-platform.result == 'success' &&
      needs.ci.result == 'success' &&
      (needs.publish-kfx.result == 'success' || needs.publish-kfx.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Download bundles artifact
        uses: actions/download-artifact@v7
        with:
          name: dist-bundles
          path: bundles-dist
      - name: Setup Environment
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
          python-version: "3.13"
      - name: Publish bundles to PyPI
        if: ${{ !inputs.dry_run }}
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
          KETOS_RELEASE_COMMIT: ${{ vars.KETOS_RELEASE_COMMIT }}
          KETOS_EXTERNAL_RELEASE: ${{ vars.KETOS_EXTERNAL_RELEASE }}
        run: |
          shopt -s nullglob
          wheels=(bundles-dist/*.whl)
          if [ ${#wheels[@]} -eq 0 ]; then
            echo "No bundle wheels to publish."
            exit 0
          fi
          failed=0
          for wheel in "${wheels[@]}"; do
            echo "Publishing $wheel"
            # Tolerate "already exists" so reruns -- or a bundle whose version is
            # unchanged and already on PyPI -- do not fail the job. Matches the
            # duplicate-tolerant publish in release_bundles.yml.
            if ! err=$(uv run python "$GITHUB_WORKSPACE/scripts/ci/require_external_release.py" && uv publish "$wheel" 2>&1); then
              echo "$err"
              if echo "$err" | grep -qiE 'already exists|file already exists|HTTP 400|duplicate'; then
                echo "Skipping $wheel: already published."
              else
                echo "Publish failed for $wheel"
                failed=1
              fi
            fi
          done
          if [ "$failed" = "1" ]; then
            exit 1
          fi

  publish-main:
    name: Publish Ketos Main to PyPI
    if: |
      always() &&
      !cancelled() &&
      inputs.release_package_main &&
      needs.build-main.result == 'success' &&
      needs.test-cross-platform.result == 'success' &&
      needs.publish-base.result == 'success' &&
      needs.ci.result == 'success' &&
      (needs.publish-bundles.result == 'success' || needs.publish-bundles.result == 'skipped')
    needs: [build-main, test-cross-platform, publish-base, publish-bundles, ci]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Download main artifact
        uses: actions/download-artifact@v7
        with:
          name: dist-main
          path: dist
      - name: Setup Environment
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
          python-version: "3.13"
      - name: Publish main to PyPI
        if: ${{ !inputs.dry_run }}
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
          KETOS_RELEASE_COMMIT: ${{ vars.KETOS_RELEASE_COMMIT }}
          KETOS_EXTERNAL_RELEASE: ${{ vars.KETOS_EXTERNAL_RELEASE }}
        run: |
          uv run python "$GITHUB_WORKSPACE/scripts/ci/require_external_release.py" && uv publish dist/*.whl

  publish-sdk:
    name: Publish ketos-sdk to PyPI
    needs: [build-sdk, test-cross-platform, ci]
    if: |
      always() &&
      !cancelled() &&
      inputs.release_sdk &&
      needs.build-sdk.result == 'success' &&
      needs.ci.result == 'success' &&
      (needs.test-cross-platform.result == 'success' || needs.test-cross-platform.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Download SDK artifact
        uses: actions/download-artifact@v7
        with:
          name: dist-sdk
          path: src/sdk/dist
      - name: Setup Environment
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
          python-version: "3.13"
      - name: Publish SDK to PyPI
        if: ${{ !inputs.dry_run }}
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
          KETOS_RELEASE_COMMIT: ${{ vars.KETOS_RELEASE_COMMIT }}
          KETOS_EXTERNAL_RELEASE: ${{ vars.KETOS_EXTERNAL_RELEASE }}
        run: |
          uv run python "$GITHUB_WORKSPACE/scripts/ci/require_external_release.py" && make sdk_publish

  publish-kfx:
    name: Publish KFX to PyPI
    needs: [build-kfx, test-cross-platform, ci, publish-sdk]
    if: |
      always() &&
      !cancelled() &&
      inputs.release_kfx &&
      needs.build-kfx.result == 'success' &&
      needs.test-cross-platform.result == 'success' &&
      needs.ci.result == 'success' &&
      (needs.publish-sdk.result == 'success' || needs.publish-sdk.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Download KFX artifact
        uses: actions/download-artifact@v7
        with:
          name: dist-kfx
          path: src/kfx/dist
      - name: Setup Environment
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
          python-version: "3.13"
      - name: Publish KFX to PyPI
        if: ${{ !inputs.dry_run }}
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
          KETOS_RELEASE_COMMIT: ${{ vars.KETOS_RELEASE_COMMIT }}
          KETOS_EXTERNAL_RELEASE: ${{ vars.KETOS_EXTERNAL_RELEASE }}
        run: |
          cd src/kfx && uv run python "$GITHUB_WORKSPACE/scripts/ci/require_external_release.py" && uv publish dist/*.whl

  call_docker_build_base:
    name: Call Docker Build Workflow for Ketos Base
    if: ${{ inputs.build_docker_base }}
    needs: [ci, determine-base-version]
    uses: ./.github/workflows/docker-build-v2.yml
    with:
      ref: ${{ inputs.release_tag }}
      release_type: base
      pre_release: ${{ inputs.pre_release }}
      version_override: ${{ needs.determine-base-version.outputs.version }}
      push_to_registry: ${{ !inputs.dry_run }}
    secrets: inherit

  call_docker_build_main:
    name: Call Docker Build Workflow for Ketos
    if: ${{ inputs.build_docker_main }}
    needs: [ci, determine-main-version]
    uses: ./.github/workflows/docker-build-v2.yml
    with:
      ref: ${{ inputs.release_tag }}
      release_type: main
      pre_release: ${{ inputs.pre_release }}
      version_override: ${{ needs.determine-main-version.outputs.version }}
      push_to_registry: ${{ !inputs.dry_run }}
    secrets: inherit

  call_docker_build_main_backend:
    name: Call Docker Build Workflow for Ketos Backend
    if: ${{ inputs.build_docker_main && !inputs.dry_run }}
    needs: [call_docker_build_main, determine-main-version]
    uses: ./.github/workflows/docker-build-v2.yml
    with:
      ref: ${{ inputs.release_tag }}
      release_type: main-backend
      pre_release: ${{ inputs.pre_release }}
      version_override: ${{ needs.determine-main-version.outputs.version }}
      push_to_registry: ${{ !inputs.dry_run }}
    secrets: inherit

  call_docker_build_main_frontend:
    name: Call Docker Build Workflow for Ketos Frontend
    if: ${{ inputs.build_docker_main && !inputs.dry_run }}
    needs: [call_docker_build_main, determine-main-version]
    uses: ./.github/workflows/docker-build-v2.yml
    with:
      ref: ${{ inputs.release_tag }}
      release_type: main-frontend
      pre_release: ${{ inputs.pre_release }}
      version_override: ${{ needs.determine-main-version.outputs.version }}
      push_to_registry: ${{ !inputs.dry_run }}
    secrets: inherit

  call_docker_build_main_ep:
    name: Call Docker Build Workflow for Ketos with Entrypoint
    if: ${{ inputs.build_docker_main }}
    needs: [ci, determine-main-version]
    uses: ./.github/workflows/docker-build-v2.yml
    with:
      ref: ${{ inputs.release_tag }}
      release_type: main-ep
      pre_release: ${{ inputs.pre_release }}
      version_override: ${{ needs.determine-main-version.outputs.version }}
      push_to_registry: ${{ !inputs.dry_run }}
    secrets: inherit

  call_docker_build_main_all:
    name: Call Docker Build Workflow for ketos-all
    if: ${{ inputs.build_docker_main }}
    needs: [ci, determine-main-version]
    uses: ./.github/workflows/docker-build-v2.yml
    with:
      ref: ${{ inputs.release_tag }}
      release_type: main-all
      pre_release: ${{ inputs.pre_release }}
      version_override: ${{ needs.determine-main-version.outputs.version }}
      push_to_registry: ${{ !inputs.dry_run }}
    secrets: inherit

  supply-chain:
    name: Generate immutable supply-chain documents
    runs-on: ubuntu-latest
    needs:
      [
        determine-main-version,
        build-sdk,
        build-kfx,
        build-base,
        build-main,
        build-bundles,
        call_docker_build_base,
        call_docker_build_main,
        call_docker_build_main_backend,
        call_docker_build_main_frontend,
        call_docker_build_main_ep,
        call_docker_build_main_all,
      ]
    if: |
      always() &&
      !cancelled() &&
      (needs.build-sdk.result == 'success' ||
       needs.build-kfx.result == 'success' ||
       needs.build-base.result == 'success' ||
       needs.build-main.result == 'success' ||
       needs.build-bundles.result == 'success' ||
       needs.call_docker_build_base.result == 'success' ||
       needs.call_docker_build_main.result == 'success' ||
       needs.call_docker_build_main_backend.result == 'success' ||
       needs.call_docker_build_main_frontend.result == 'success' ||
       needs.call_docker_build_main_ep.result == 'success' ||
       needs.call_docker_build_main_all.result == 'success')
    steps:
      - name: Checkout approved release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Setup supply-chain runtime
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
          python-version: "3.13"

      - name: Download SDK distributions
        if: ${{ needs.build-sdk.result == 'success' }}
        uses: actions/download-artifact@v7
        with:
          name: dist-sdk
          path: release-inputs/distributions/sdk

      - name: Download KFX distributions
        if: ${{ needs.build-kfx.result == 'success' }}
        uses: actions/download-artifact@v7
        with:
          name: dist-kfx
          path: release-inputs/distributions/kfx

      - name: Download Ketos Base distributions
        if: ${{ needs.build-base.result == 'success' }}
        uses: actions/download-artifact@v7
        with:
          name: dist-base
          path: release-inputs/distributions/base

      - name: Download Ketos distributions
        if: ${{ needs.build-main.result == 'success' }}
        uses: actions/download-artifact@v7
        with:
          name: dist-main
          path: release-inputs/distributions/main

      - name: Download bundle distributions
        if: ${{ needs.build-bundles.result == 'success' }}
        uses: actions/download-artifact@v7
        with:
          name: dist-bundles
          path: release-inputs/distributions/bundles

      - name: Download immutable OCI subjects from completed image builds
        if: |
          needs.call_docker_build_base.result == 'success' ||
          needs.call_docker_build_main.result == 'success' ||
          needs.call_docker_build_main_backend.result == 'success' ||
          needs.call_docker_build_main_frontend.result == 'success' ||
          needs.call_docker_build_main_ep.result == 'success' ||
          needs.call_docker_build_main_all.result == 'success'
        uses: actions/download-artifact@v7
        with:
          pattern: oci-subject-*
          path: release-inputs/oci-subjects
          merge-multiple: true

      - name: Generate release archive and supply-chain documents
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ needs.determine-main-version.outputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${{ inputs.release_tag }}"
            VERSION="${VERSION#v}"
          fi

          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          export SOURCE_DATE_EPOCH
          SOURCE_URI="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"

          mkdir -p release-inputs/release-archives supply-chain/
          git archive --format=tar --prefix="ketos-${VERSION}/" "$GITHUB_SHA" \
            | gzip -n > "release-inputs/release-archives/ketos-${VERSION}-source.tar.gz"
          git archive --format=zip --prefix="ketos-${VERSION}/" "$GITHUB_SHA" \
            > "release-inputs/release-archives/ketos-${VERSION}-source.zip"

          mapfile -d '' release_files < <(
            find release-inputs -type f \
              \( -name '*.whl' -o -name '*.tar.gz' -o -name '*.zip' \) \
              -print0 | sort -z
          )
          if [ "${#release_files[@]}" -eq 0 ]; then
            echo "No immutable release inputs were collected."
            exit 1
          fi

          artifact_args=()
          for artifact in "${release_files[@]}"; do
            artifact_args+=(--artifact "${artifact#release-inputs/}")
          done

          expected_oci_args=()
          if [ "${{ inputs.build_docker_base }}" = "true" ]; then
            expected_oci_args+=(--expected-release-type base)
          fi
          if [ "${{ inputs.build_docker_main }}" = "true" ]; then
            expected_oci_args+=(--expected-release-type main --expected-release-type main-ep --expected-release-type main-all)
            if [ "${{ inputs.dry_run }}" != "true" ]; then
              expected_oci_args+=(--expected-release-type main-backend --expected-release-type main-frontend)
            fi
          fi

          oci_args=()
          if [ "${#expected_oci_args[@]}" -gt 0 ]; then
            mapfile -t oci_subjects < <(
              uv run python scripts/ci/collect_oci_subjects.py \
                --input-dir release-inputs/oci-subjects \
                "${expected_oci_args[@]}"
            )
            if [ "${#oci_subjects[@]}" -eq 0 ]; then
              echo "Selected OCI builds did not produce immutable subjects."
              exit 1
            fi
            for subject in "${oci_subjects[@]}"; do
              oci_args+=(--oci-subject "$subject")
            done
          fi

          uv run python scripts/ci/generate_supply_chain.py \
            --artifact-root release-inputs \
            "${artifact_args[@]}" \
            "${oci_args[@]}" \
            --output-dir supply-chain \
            --source-uri "$SOURCE_URI" \
            --commit-sha "$GITHUB_SHA" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --name ketos \
            --version "$VERSION"

      - name: Upload supply-chain documents
        uses: actions/upload-artifact@v7
        with:
          name: supply-chain
          path: supply-chain/

      - name: Upload deterministic release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-archives
          path: release-inputs/release-archives/

  create_release:
    name: Create Release
    runs-on: ubuntu-latest
    needs:
      [determine-main-version, build-main, publish-main, validate-tag-format, supply-chain]
    if: |
      always() &&
      !cancelled() &&
      !inputs.dry_run &&
      inputs.create_release &&
      needs.build-main.result == 'success' &&
      needs.publish-main.result == 'success' &&
      needs.supply-chain.result == 'success' &&
      needs.validate-tag-format.result == 'success'
    steps:
      - name: Checkout approved release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Setup release gate runtime
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: dist-main
          path: dist
      - uses: actions/download-artifact@v7
        with:
          name: supply-chain
          path: supply-chain
      - uses: actions/download-artifact@v7
        with:
          name: release-archives
          path: release-archives
      - name: Create Release
        env:
          KETOS_RELEASE_COMMIT: ${{ vars.KETOS_RELEASE_COMMIT }}
          KETOS_EXTERNAL_RELEASE: ${{ vars.KETOS_EXTERNAL_RELEASE }}
        run: uv run python "$GITHUB_WORKSPACE/scripts/ci/require_external_release.py"
      - name: Publish approved GitHub release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "dist/*,release-archives/*,supply-chain/*"
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          generateReleaseNotes: true
          prerelease: ${{ inputs.pre_release }}
          tag: ${{ inputs.pre_release && needs.determine-main-version.outputs.version || inputs.release_tag }}
          name: ${{ needs.determine-main-version.outputs.version }}
          commit: ${{ github.sha }}
          allowUpdates: true
          updateOnlyUnreleased: false
