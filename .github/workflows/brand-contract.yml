name: Ketos brand contract

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  brand-contract:
    name: Rebrand contract and frozen-debt gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.13"

      - name: Install test dependencies
        run: uv sync --frozen --only-group dev

      - name: Test brand contracts and scanner
        run: uv run pytest scripts/rebrand/tests -q

      - name: Reject new or reclassified Langflow residue
        run: uv run python scripts/rebrand/check_brand.py --profile stage0
