name: Ketos brand contract

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  brand-contract:
    name: Destructive cutover contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.13"

      - name: Install test dependencies
        run: uv sync --frozen --only-group dev

      - name: Test brand contracts and scanner
        run: PYTHONDONTWRITEBYTECODE=1 uv run pytest -p no:cacheprovider scripts/rebrand/tests -q

      - name: Reject any increase from the frozen baseline
        run: PYTHONDONTWRITEBYTECODE=1 uv run python scripts/rebrand/check_brand.py --profile stage0 --zero-residue-contract brand/ketos-zero-residue-contract.yaml

      - name: Produce the strict cutover report
        id: cutover
        continue-on-error: true
        run: PYTHONDONTWRITEBYTECODE=1 uv run python scripts/rebrand/check_brand.py --profile cutover --format json --zero-residue-contract brand/ketos-zero-residue-contract.yaml > ketos-cutover-report.json

      - name: Upload strict cutover report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ketos-cutover-report
          path: ketos-cutover-report.json
