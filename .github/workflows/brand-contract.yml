name: Ketos brand contract

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  brand-contract:
    name: Stage 0 compatibility-first brand contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.13"

      - name: Install test dependencies
        run: uv sync --frozen --only-group dev

      - name: Test fast contracts and scanner
        timeout-minutes: 5
        run: PYTHONDONTWRITEBYTECODE=1 uv run pytest -p no:cacheprovider scripts/rebrand/tests -q -m "not slow"

      - name: Test cold-start contracts
        timeout-minutes: 15
        run: PYTHONDONTWRITEBYTECODE=1 uv run pytest -p no:cacheprovider scripts/rebrand/tests -q -m slow

      - name: Scan visible surfaces
        id: visible
        continue-on-error: true
        run: uv run python scripts/rebrand/check_brand.py --profile visible --format json > brand-visible.json

      - name: Scan official endpoints and remote policy
        id: official
        continue-on-error: true
        run: uv run python scripts/rebrand/check_brand.py --profile official-url --format json > brand-official-url.json

      - name: Scan technical compatibility ledger
        id: technical
        continue-on-error: true
        run: uv run python scripts/rebrand/check_brand.py --profile technical-compatibility --format json > brand-technical-compatibility.json

      - name: Upload categorized brand reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ketos-stage0-brand-reports
          path: |
            brand-visible.json
            brand-official-url.json
            brand-technical-compatibility.json

      - name: Enforce all Stage 0 profiles
        if: always()
        env:
          VISIBLE: ${{ steps.visible.outcome }}
          OFFICIAL: ${{ steps.official.outcome }}
          TECHNICAL: ${{ steps.technical.outcome }}
        run: test "$VISIBLE" = success && test "$OFFICIAL" = success && test "$TECHNICAL" = success
