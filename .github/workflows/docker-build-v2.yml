        run: |
          version="${{ needs.determine-main-version.outputs.version }}"
          echo "docker_tags=registry.invalid/ketos/ketos-ep:${version}-${{ matrix.arch }}" >> $GITHUB_OUTPUT
          echo "ghcr_tags=registry.invalid/ketos/ketos-ep:${version}-${{ matrix.arch }}" >> $GITHUB_OUTPUT

