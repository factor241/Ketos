    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Set tags
        id: tags
        run: |
          version="${{ needs.determine-main-version.outputs.version }}"
          echo "docker_tags=registry.invalid/ketos/ketos-backend:${version}-${{ matrix.arch }}" >> $GITHUB_OUTPUT
          echo "ghcr_tags=registry.invalid/ketos/ketos-backend:${version}-${{ matrix.arch }}" >> $GITHUB_OUTPUT

      - name: Docker cleanup
        run: |
          docker system prune -af --volumes || true
          docker buildx prune -af || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push to Docker Hub
        id: oci_build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false # external publish disabled; immutable gate required
          build-args: |
            KETOS_IMAGE=registry.invalid/ketos/ketos:${{ needs.determine-main-version.outputs.version }}-${{ matrix.arch }}
          file: ./docker/build_and_push_backend.Dockerfile
          tags: ${{ steps.tags.outputs.docker_tags }}
          platforms: linux/${{ matrix.arch }}
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record immutable OCI subject
        env:
          ARCH: ${{ matrix.arch }}
          IMAGE_DIGEST: ${{ steps.oci_build.outputs.digest }}
          IMAGE_TAG: ${{ steps.tags.outputs.docker_tags }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          set -euo pipefail
          printf '%s' "$IMAGE_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
          IMAGE_NAME="${IMAGE_TAG%:*}"
          printf '{"arch":"%s","release_type":"%s","subject":"%s@%s"}\n' \
            "$ARCH" "$RELEASE_TYPE" "$IMAGE_NAME" "$IMAGE_DIGEST" \
            > "oci-subject-${RELEASE_TYPE}-${ARCH}.json"

      - name: Upload immutable OCI subject
        uses: actions/upload-artifact@v7
        with:
          name: oci-subject-${{ inputs.release_type }}-${{ matrix.arch }}
          path: oci-subject-${{ inputs.release_type }}-${{ matrix.arch }}.json

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.TEMP_GHCR_TOKEN}}

      - name: Build and push to GitHub Container Registry
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false # external publish disabled; immutable gate required
          build-args: |
            KETOS_IMAGE=registry.invalid/ketos/ketos:${{ needs.determine-main-version.outputs.version }}-${{ matrix.arch }}
          file: ./docker/build_and_push_backend.Dockerfile
          tags: ${{ steps.tags.outputs.ghcr_tags }}
          platforms: linux/${{ matrix.arch }}
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-main-frontend:
    name: Build Main Frontend Package
    needs: [determine-main-version]
    if: ${{ inputs.release_type == 'main-frontend' && needs.determine-main-version.outputs.skipped == 'false' }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: [Ketos-runner]
          - arch: arm64
            runner:
              [self-hosted, linux, ARM64, ketos-local-arm64-40gb-ephemeral]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Set tags
        id: tags
        run: |
          version="${{ needs.determine-main-version.outputs.version }}"
          echo "docker_tags=registry.invalid/ketos/ketos-frontend:${version}-${{ matrix.arch }}" >> $GITHUB_OUTPUT
          echo "ghcr_tags=registry.invalid/ketos/ketos-frontend:${version}-${{ matrix.arch }}" >> $GITHUB_OUTPUT

      - name: Docker cleanup
        run: |
          docker system prune -af --volumes || true
          docker buildx prune -af || true

