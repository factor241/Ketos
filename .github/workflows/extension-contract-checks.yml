name: Extension Contract Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, auto_merge_enabled]
    paths:
      - "BUNDLE_API.md"
      - "scripts/migrate/check_bundle_api_changelog.py"
      - "scripts/migrate/check_router_trust.py"
      - "src/kfx/src/kfx/extension/**"
      - "src/kfx/src/kfx/components/**"
      - "src/bundles/**"
      - "src/backend/base/ketos/api/**.py"
      - ".github/workflows/extension-contract-checks.yml"

jobs:
  bundle-api-changelog:
    name: BUNDLE_API.md changelog gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run check_bundle_api_changelog.py
        run: |
          base_ref="origin/${GITHUB_BASE_REF:-main}"
          python scripts/migrate/check_bundle_api_changelog.py --base "$base_ref"

  router-trust:
    name: Router trust - no install/uninstall under /api/v1/extensions
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run check_router_trust.py
        run: python scripts/migrate/check_router_trust.py
