[project]
name = "kfx-arxiv"
version = "0.1.1"
description = "arXiv search component as a standalone Ketos Extension Bundle."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Ketos", email = "contact@ketos.test" },
]
keywords = ["ketos", "kfx", "extension", "bundle", "arxiv", "search"]

# Runtime deps: kfx (the BUNDLE_API surface) plus defusedxml for safe XML
# parsing (the arxiv API returns Atom).  defusedxml is already an kfx dep
# but we list it here as a direct runtime dep so the bundle keeps building
# even if kfx drops it later.
dependencies = [
    "kfx>=1.10.0.dev0,<2.0.0",
    "defusedxml>=0.7.1,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/factor241/Ketos"
Documentation = "https://github.com/factor241/Ketos"
Repository = "https://github.com/factor241/Ketos"

# Manifest-shipping distributions are discovered via the
# ``ketos.extensions`` entry-point.  The value is the dotted path to
# the package containing ``extension.json`` -- the loader walks
# ``importlib.metadata.files()`` from there to find the manifest, and
# falls back to this entry-point for editable installs whose dist.files
# only surfaces dist-info entries.
[project.entry-points."ketos.extensions"]
kfx-arxiv = "kfx_arxiv"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# extension.json + components live inside the kfx_arxiv package so
# ``importlib.metadata.files(dist)`` finds them and the loader resolves
# bundles[].path relative to the manifest's directory.
packages = ["src/kfx_arxiv"]
include = ["src/kfx_arxiv/extension.json", "src/kfx_arxiv/components/**/*.py"]

[tool.hatch.build.targets.sdist]
include = [
    "src/kfx_arxiv",
    "extension.json",
    "README.md",
    "pyproject.toml",
]
