name: GP Download Translations

on:
  schedule:
    - cron: "0 23 * * *" # 11 PM UTC — 1h before nightly build at midnight
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    name: Download translations from Globalization Pipeline
    environment: GP-test
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Resolve latest release branch
        id: resolve-branch
        run: |
          BRANCH=$(git ls-remote --heads https://github.com/${{ github.repository }} 'refs/heads/release-*' \
            | awk '{print $2}' \
            | sed 's|refs/heads/||' \
            | grep -E '^release-[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n 1)
          if [ -z "$BRANCH" ]; then
            echo "No release-* branch found in ${{ github.repository }}"
            exit 1
          fi
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "Using release branch: $BRANCH"

      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve-branch.outputs.branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/gp/requirements.txt

      - name: Download translations from GP
        working-directory: scripts/gp
        env:
          GP_ADMIN_USER_ID: ${{ secrets.GP_ADMIN_USER_ID }}
          GP_ADMIN_PASSWORD: ${{ secrets.GP_ADMIN_PASSWORD }}
          GP_INSTANCE: ${{ vars.GP_INSTANCE }}
          GP_BUNDLE: ${{ vars.GP_BUNDLE }}
        run: |
          python download.py --target frontend --lang ru --source ../../src/frontend/src/locales/en.json --output /tmp/gp-ru-frontend
          python download.py --target frontend --source ../../src/frontend/src/locales/en.json --output ../../src/frontend/src/locales/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Validate frontend locale contracts
        working-directory: src/frontend
        run: npm run i18n:check && npm run i18n:check-keys

      - name: Require CI-triggering PR token and linguistic reviewer
        env:
          GP_TRANSLATION_PR_TOKEN: ${{ secrets.GP_TRANSLATION_PR_TOKEN }}
          GP_LINGUISTIC_REVIEWER: ${{ vars.GP_LINGUISTIC_REVIEWER }}
        run: |
          missing=""
          [ -n "$GP_TRANSLATION_PR_TOKEN" ] || missing="$missing GP_TRANSLATION_PR_TOKEN"
          [ -n "$GP_LINGUISTIC_REVIEWER" ] || missing="$missing GP_LINGUISTIC_REVIEWER"
          if [ -n "$missing" ]; then
            echo "Missing required configuration names:$missing"
            exit 1
          fi

      - name: Close stale translation PRs
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });
            for (const pull of pulls) {
              if (pull.title === "chore: update translations from Globalization Pipeline") {
                await github.rest.pulls.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pull.number,
                  state: 'closed'
                });
              }
            }

      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GP_TRANSLATION_PR_TOKEN }}
          branch-token: ${{ secrets.GP_TRANSLATION_PR_TOKEN }}
          base: ${{ steps.resolve-branch.outputs.branch }}
          commit-message: "chore: update translations from Globalization Pipeline"
          title: "chore: update translations from Globalization Pipeline"
          body: |
            Automated PR to update locale files from IBM Globalization Pipeline.

            This PR was automatically created by the `gp-download` workflow.
            Locale contracts must pass and linguistic review is required before merge.
            Required checks: `CI Success` and `I18n Contract Gates`.
            Manual gate: update the current catalog hash in `linguistic-review.md`, obtain `APPROVED`, then mark this draft ready.
            Auto-merge must remain disabled.
            If no files changed, this PR will be empty and can be closed.
          branch: translations/update-gp
          branch-suffix: timestamp
          delete-branch: true
          maintainer-can-modify: true
          draft: true
          reviewers: ${{ vars.GP_LINGUISTIC_REVIEWER }}
          add-paths: src/frontend/src/locales/*.json

      - name: Record translation PR gate state
        if: steps.create-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GP_TRANSLATION_PR_TOKEN }}
        run: |
          gh pr view "${{ steps.create-pr.outputs.pull-request-number }}" \
            --repo "${{ github.repository }}" \
            --json url,headRefOid,isDraft,reviewDecision,autoMergeRequest,statusCheckRollup

      - name: Report GP download failure
        if: failure()
        run: echo "::warning::GP translation download failed — translations may be out of date. Check the 'Download translations from GP' step above for details."

  download-backend:
    runs-on: ubuntu-latest
    name: Download backend translations from Globalization Pipeline
    environment: GP-test
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Resolve latest release branch
        id: resolve-branch
        run: |
          BRANCH=$(git ls-remote --heads https://github.com/${{ github.repository }} 'refs/heads/release-*' \
            | awk '{print $2}' \
            | sed 's|refs/heads/||' \
            | grep -E '^release-[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n 1)
          if [ -z "$BRANCH" ]; then
            echo "No release-* branch found in ${{ github.repository }}"
            exit 1
          fi
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "Using release branch: $BRANCH"

      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve-branch.outputs.branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/gp/requirements.txt

      - name: Download backend translations from GP
        working-directory: scripts/gp
        env:
          GP_ADMIN_USER_ID: ${{ secrets.GP_ADMIN_USER_ID }}
          GP_ADMIN_PASSWORD: ${{ secrets.GP_ADMIN_PASSWORD }}
          GP_INSTANCE: ${{ vars.GP_INSTANCE }}
          GP_BACKEND_BUNDLE: ${{ vars.GP_BACKEND_BUNDLE }}
        run: |
          python download.py --target backend --lang ru --source ../../src/backend/base/langflow/locales/en.json --output /tmp/gp-ru-backend
          python download.py --target backend --source ../../src/backend/base/langflow/locales/en.json

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      - name: Install backend workspace
        run: uv sync --no-dev

      - name: Validate backend locale contracts
        run: uv run python scripts/i18n/check_backend_locales.py

      - name: Require CI-triggering PR token and linguistic reviewer
        env:
          GP_TRANSLATION_PR_TOKEN: ${{ secrets.GP_TRANSLATION_PR_TOKEN }}
          GP_LINGUISTIC_REVIEWER: ${{ vars.GP_LINGUISTIC_REVIEWER }}
        run: |
          missing=""
          [ -n "$GP_TRANSLATION_PR_TOKEN" ] || missing="$missing GP_TRANSLATION_PR_TOKEN"
          [ -n "$GP_LINGUISTIC_REVIEWER" ] || missing="$missing GP_LINGUISTIC_REVIEWER"
          if [ -n "$missing" ]; then
            echo "Missing required configuration names:$missing"
            exit 1
          fi

      - name: Close stale backend translation PRs
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });
            for (const pull of pulls) {
              if (pull.title === "chore: update backend translations from Globalization Pipeline") {
                await github.rest.pulls.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pull.number,
                  state: 'closed'
                });
              }
            }

      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GP_TRANSLATION_PR_TOKEN }}
          branch-token: ${{ secrets.GP_TRANSLATION_PR_TOKEN }}
          base: ${{ steps.resolve-branch.outputs.branch }}
          commit-message: "chore: update backend translations from Globalization Pipeline"
          title: "chore: update backend translations from Globalization Pipeline"
          body: |
            Automated PR to update backend locale files from IBM Globalization Pipeline.

            This PR was automatically created by the `gp-download` workflow.
            Locale contracts must pass and linguistic review is required before merge.
            Required checks: `CI Success` and `I18n Contract Gates`.
            Manual gate: update the current catalog hash in `linguistic-review.md`, obtain `APPROVED`, then mark this draft ready.
            Auto-merge must remain disabled.
            If no files changed, this PR will be empty and can be closed.
          branch: translations/update-backend-gp
          branch-suffix: timestamp
          delete-branch: true
          maintainer-can-modify: true
          draft: true
          reviewers: ${{ vars.GP_LINGUISTIC_REVIEWER }}
          add-paths: src/backend/base/langflow/locales/*.json

      - name: Record translation PR gate state
        if: steps.create-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GP_TRANSLATION_PR_TOKEN }}
        run: |
          gh pr view "${{ steps.create-pr.outputs.pull-request-number }}" \
            --repo "${{ github.repository }}" \
            --json url,headRefOid,isDraft,reviewDecision,autoMergeRequest,statusCheckRollup

      - name: Report GP backend download failure
        if: failure()
        run: echo "::warning::GP backend translation download failed — backend translations may be out of date. Check the 'Download backend translations from GP' step above for details."
