      - name: Set tags
        id: tags
        run: |
          version="${{ needs.determine-main-version.outputs.version }}"
          echo "docker_tags=registry.invalid/ketos/ketos-all:${version}-${{ matrix.arch }}" >> $GITHUB_OUTPUT
          echo "ghcr_tags=registry.invalid/ketos/ketos-all:${version}-${{ matrix.arch }}" >> $GITHUB_OUTPUT

      - name: Docker cleanup
        run: |
          docker system prune -af --volumes || true
          docker buildx prune -af || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.TEMP_GHCR_TOKEN}}

      - name: Build and push to Docker Hub
        id: oci_build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false # external publish disabled; immutable gate required
          file: ./docker/build_and_push_with_extras.Dockerfile
          tags: ${{ steps.tags.outputs.docker_tags }}
          platforms: linux/${{ matrix.arch }}
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record immutable OCI subject
        env:
          ARCH: ${{ matrix.arch }}
          IMAGE_DIGEST: ${{ steps.oci_build.outputs.digest }}
          IMAGE_TAG: ${{ steps.tags.outputs.docker_tags }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          set -euo pipefail
          printf '%s' "$IMAGE_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
          IMAGE_NAME="${IMAGE_TAG%:*}"
          printf '{"arch":"%s","release_type":"%s","subject":"%s@%s"}\n' \
            "$ARCH" "$RELEASE_TYPE" "$IMAGE_NAME" "$IMAGE_DIGEST" \
            > "oci-subject-${RELEASE_TYPE}-${ARCH}.json"

      - name: Upload immutable OCI subject
        uses: actions/upload-artifact@v7
        with:
          name: oci-subject-${{ inputs.release_type }}-${{ matrix.arch }}
          path: oci-subject-${{ inputs.release_type }}-${{ matrix.arch }}.json

      - name: Build and push to GitHub Container Registry
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false # external publish disabled; immutable gate required
          file: ./docker/build_and_push_with_extras.Dockerfile
          tags: ${{ steps.tags.outputs.ghcr_tags }}
          platforms: linux/${{ matrix.arch }}
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-manifest:
    name: External manifest publication disabled
    needs:
      [
        build-base,
        build-main,
        build-main-backend,
        build-main-frontend,
        build-main-ep,
        build-main-all,
        determine-base-version,
        determine-main-version,
      ]
    runs-on: ubuntu-latest
    if: ${{ inputs.push_to_registry }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Setup Environment
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"
          prune-cache: false

      - name: Get version
        id: version
        run: |
          if [[ "${{ inputs.release_type }}" == "base" ]]; then
            version=$(uv tree 2>/dev/null | grep 'ketos-base' | awk '{print $3}' | sed 's/^v//' | head -n 1)
          else
            version=$(uv tree 2>/dev/null | grep -E '^ketos(-nightly)?[[:space:]]' | cut -d' ' -f2 | sed 's/^v//')
          fi
          echo "Using version: $version"
          echo version=$version >> $GITHUB_OUTPUT

      - name: Set tags
        id: tags
        run: |
          version="${{ needs.determine-main-version.outputs.version }}"
          case "${{ inputs.release_type }}" in
            "base")
              version="${{ needs.determine-base-version.outputs.version }}"
              if [[ "${{ inputs.pre_release }}" == "true" ]]; then
                echo "final_tags=registry.invalid/ketos/ketos:base-${version},registry.invalid/ketos/ketos:base-${version}" >> $GITHUB_OUTPUT
              else
                echo "final_tags=registry.invalid/ketos/ketos:base-${version},registry.invalid/ketos/ketos:base-latest,registry.invalid/ketos/ketos:base-${version},registry.invalid/ketos/ketos:base-latest" >> $GITHUB_OUTPUT
              fi
              echo "arch_base=registry.invalid/ketos/ketos:base-${version}" >> $GITHUB_OUTPUT
              echo "ghcr_arch_base=registry.invalid/ketos/ketos:base-${version}" >> $GITHUB_OUTPUT
              ;;
            "main")
              if [[ "${{ inputs.pre_release }}" == "true" ]]; then
                echo "final_tags=registry.invalid/ketos/ketos:${version},registry.invalid/ketos/ketos:${version}" >> $GITHUB_OUTPUT
              else
                echo "final_tags=registry.invalid/ketos/ketos:${version},registry.invalid/ketos/ketos:latest,registry.invalid/ketos/ketos:${version},registry.invalid/ketos/ketos:latest" >> $GITHUB_OUTPUT
              fi
              echo "arch_base=registry.invalid/ketos/ketos:${version}" >> $GITHUB_OUTPUT
              echo "ghcr_arch_base=registry.invalid/ketos/ketos:${version}" >> $GITHUB_OUTPUT
              ;;
            "main-backend")
              if [[ "${{ inputs.pre_release }}" == "true" ]]; then
                echo "final_tags=registry.invalid/ketos/ketos-backend:${version},registry.invalid/ketos/ketos-backend:${version}" >> $GITHUB_OUTPUT
              else
                echo "final_tags=registry.invalid/ketos/ketos-backend:${version},registry.invalid/ketos/ketos-backend:latest,registry.invalid/ketos/ketos-backend:${version},registry.invalid/ketos/ketos-backend:latest" >> $GITHUB_OUTPUT
              fi
              echo "arch_base=registry.invalid/ketos/ketos-backend:${version}" >> $GITHUB_OUTPUT
              echo "ghcr_arch_base=registry.invalid/ketos/ketos-backend:${version}" >> $GITHUB_OUTPUT
              ;;
            "main-frontend")
              if [[ "${{ inputs.pre_release }}" == "true" ]]; then
                echo "final_tags=registry.invalid/ketos/ketos-frontend:${version},registry.invalid/ketos/ketos-frontend:${version}" >> $GITHUB_OUTPUT
              else
                echo "final_tags=registry.invalid/ketos/ketos-frontend:${version},registry.invalid/ketos/ketos-frontend:latest,registry.invalid/ketos/ketos-frontend:${version},registry.invalid/ketos/ketos-frontend:latest" >> $GITHUB_OUTPUT
              fi
              echo "arch_base=registry.invalid/ketos/ketos-frontend:${version}" >> $GITHUB_OUTPUT
              echo "ghcr_arch_base=registry.invalid/ketos/ketos-frontend:${version}" >> $GITHUB_OUTPUT
              ;;
            "main-ep")
              if [[ "${{ inputs.pre_release }}" == "true" ]]; then
                echo "final_tags=registry.invalid/ketos/ketos-ep:${version},registry.invalid/ketos/ketos-ep:${version}" >> $GITHUB_OUTPUT
              else
                echo "final_tags=registry.invalid/ketos/ketos-ep:${version},registry.invalid/ketos/ketos-ep:latest,registry.invalid/ketos/ketos-ep:${version},registry.invalid/ketos/ketos-ep:latest" >> $GITHUB_OUTPUT
              fi
              echo "arch_base=registry.invalid/ketos/ketos-ep:${version}" >> $GITHUB_OUTPUT
              echo "ghcr_arch_base=registry.invalid/ketos/ketos-ep:${version}" >> $GITHUB_OUTPUT
              ;;
            "main-all")
              if [[ "${{ inputs.pre_release }}" == "true" ]]; then
                echo "final_tags=registry.invalid/ketos/ketos-all:${version},registry.invalid/ketos/ketos-all:${version}" >> $GITHUB_OUTPUT
              else
                echo "final_tags=registry.invalid/ketos/ketos-all:${version},registry.invalid/ketos/ketos-all:latest,registry.invalid/ketos/ketos-all:${version},registry.invalid/ketos/ketos-all:latest" >> $GITHUB_OUTPUT
              fi
              echo "arch_base=registry.invalid/ketos/ketos-all:${version}" >> $GITHUB_OUTPUT
              echo "ghcr_arch_base=registry.invalid/ketos/ketos-all:${version}" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "Error: Invalid release_type: ${{ inputs.release_type }}" >&2
              exit 1
              ;;
          esac

      - name: Confirm external manifest publication is disabled
        run: echo "Architecture images are local-only; no remote manifest is published."
