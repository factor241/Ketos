[project]
name = "langflow-stepflow"
version = "0.1.0"
description = "Compatibility aliases for the canonical Ketos Stepflow backend"
license = "Apache-2.0"
requires-python = ">=3.10,<3.15"
dependencies = [
    "ketos-stepflow==0.1.0",
    "lfx==1.10.2",
    "langflow-base==0.10.2",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langflow_stepflow"]

[tool.hatch.build.targets.sdist]
exclude = ["/tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.9.10",
]
