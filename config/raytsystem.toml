schema_version = "1.4.0"
environment = "development"
default_promotion_mode = "manual"
control_db = "ops/control.sqlite"
index_db = ".raytsystem/index.sqlite"

[documents]
index_db = ".raytsystem/documents.sqlite"
max_files = 100000
max_file_bytes = 5242880
max_total_bytes = 2147483648
search_page_size = 50
allow_maintainer_docs_write = false

[[documents.roots]]
id = "manual"
path = "knowledge/manual"
mode = "read_write"
kind = "notes"

[[documents.roots]]
id = "ketos-docs"
path = "docs"
mode = "read_only"
kind = "documentation"

[[documents.roots]]
id = "ketos-source"
path = "src"
mode = "read_only"
kind = "software"

[[documents.roots]]
id = "langflow-reference"
path = "references/langflow-upstream"
mode = "read_only"
kind = "upstream-reference"

[[documents.roots]]
id = "raytsystem-docs"
path = "raytsystem/docs"
mode = "read_only"
kind = "documentation"

