# Stand overlay (docker/stand): extends the shipped Web defaults for two
# containers on one host. The CLI rejects `--host 0.0.0.0` on a developer
# machine by design, so the container claims the all-interfaces bind here,
# where the published host port is the only way in. `KETOS_PORT` distinguishes
# the two instances; `KETOS_TRUSTED_HOSTS` adds non-loopback authorities when
# the board is opened through a LAN address instead of localhost.
#
# A patch replaces the targeted row's whole `config`, so each row restates
# every key it owns.

- id: webserver
  name: '@deepseek-ai/dsh-host-webserver'
  config:
    host: '0.0.0.0'
    port: !!js Number(process.env.KETOS_PORT ?? 3080)
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024

- id: web-runtime
  name: '@deepseek-ai/dsh-web-app'
  config:
    openBrowser: false
    printUrl: true
    surfaceContext: true
    trustedHosts: !!js (process.env.KETOS_TRUSTED_HOSTS ?? '').split(',').filter(Boolean)

# Model route and default model for the stand: the key arrives as an
# environment variable from the root .env (compose env_file), never baked in.
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      opencode-go:
        apiKeyEnv: OPENCODE_GO_API_KEY

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: opencode-go
    model: deepseek-v4.1-flash

# Peer channel: the shipped web profile keeps `ketos-peer` disabled because a
# developer machine has no participant name or relay; the stand enables the
# same row with this computer's identity, the team's private relay, and the
# Syncthing integration for the shared folder. The model key above, the
# Syncthing GUI key (`STGUIAPIKEY`), and these values arrive as environment
# variables only: `syncthing.apiKeyEnv` names the GUI key variable, and
# `syncthing.relayAddress` is `$KETOS_SYNCTHING_RELAY` without its `token`
# query parameter, so the plugin receives the relay location and `id` but never
# the token. An unset, empty, or unparsable `KETOS_SYNCTHING_RELAY` gives an
# empty address, which the plugin rejects at load: the `URL` error of an
# unparsable value carries the input, token included, so it is swallowed here.
- id: ketos-peer
  name: '@ketos/peer'
  disabled: false
  config:
    name: !!js process.env.KETOS_PARTICIPANT_NAME ?? ''
    relayUrls: !!js (process.env.KETOS_RELAY_URLS ?? '').split(',').filter(Boolean)
    keyPath: !!js dshHomePath('peer.key')
    peersPath: !!js dshHomePath('peers.json')
    # A dial started while the relay is still reconnecting wastes the whole timeout; measured dials take 0.5-1 s.
    connectTimeoutMs: 5000
    # Back online within 30 s even when a dial after a long outage times out: pause <= 5 s + failed dial 5 s + pause <= 5 s + dial.
    reconnectMaxMs: 5000
    syncthing:
      url: http://127.0.0.1:8384
      apiKeyEnv: STGUIAPIKEY
      relayAddress: !!js "(s => { try { const u = new URL(s); u.searchParams.delete('token'); return u.href } catch { return '' } })(process.env.KETOS_SYNCTHING_RELAY ?? '')"
      folderId: ketos-shared
      folderPath: /workspace/shared
      fsWatcherDelayS: 1

# To-do lists: the same row as the web profile except `bdTimeoutMs`. The first
# `/todo` on a fresh stand runs `bd init`, which under the load of a
# demonstration (a model turn and screen recordings) can exceed the 15-second
# package default.
- id: ketos-board-todo
  name: '@ketos/board-todo'
  config:
    beadsDir: !!js dshHomePath('beads')
    bdCommand: bd
    beadsPrefix: kt
    bdTimeoutMs: 60000
    bdOutputMaxBytes: 1048576
    todoTitleMaxChars: 200

# Host log: the web profile ships no console exporter, so `ketos-peer`
# warnings (peer.connected, board.sync.too-large, bd errors) would stay
# invisible. The vendored exporter is loaded by path because it is not a
# dependency of any bundle; `docker compose logs` shows its lines.
- insert:
    - id: logger-console
      name: /app/vendor/logger-console/lib/index.js
      config:
        colors: false
        levels:
          default: 2
        showTime: 'yyyy-MM-dd hh:mm:ss '
