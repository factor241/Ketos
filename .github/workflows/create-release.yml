name: Verify Canonical Release Entrypoint

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-release-entrypoint:
    name: Verify canonical release workflow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable workflow commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Confirm standalone publishing is disabled
        run: |
          test -f .github/workflows/release.yml
          echo "Standalone release publishing is disabled. Use the canonical release.yml workflow."
