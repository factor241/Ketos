# Stand overlay (docker/stand): extends the shipped Web defaults for two
# containers on one host. The CLI rejects `--host 0.0.0.0` on a developer
# machine by design, so the container claims the all-interfaces bind here,
# where the published host port is the only way in. `KETOS_PORT` distinguishes
# the two instances; `KETOS_TRUSTED_HOSTS` adds non-loopback authorities when
# the board is opened through a LAN address instead of localhost.
#
# A patch replaces the targeted row's whole `config`, so each row restates
# every key it owns.

- id: webserver
  name: '@deepseek-ai/dsh-host-webserver'
  config:
    host: '0.0.0.0'
    port: !!js Number(process.env.KETOS_PORT ?? 3080)
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024

- id: web-runtime
  name: '@deepseek-ai/dsh-web-app'
  config:
    openBrowser: false
    printUrl: true
    surfaceContext: true
    trustedHosts: !!js (process.env.KETOS_TRUSTED_HOSTS ?? '').split(',').filter(Boolean)

# Model route and default model for the stand: the key arrives as an
# environment variable from the root .env (compose env_file), never baked in.
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      opencode-go:
        apiKeyEnv: OPENCODE_GO_API_KEY

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: opencode-go
    model: deepseek-v4.1-flash

# Peer channel: the shipped web profile keeps `ketos-peer` disabled because a
# developer machine has no participant name or relay; the stand enables the
# same row with this computer's identity and the team's private relay. The
# model key above and these values arrive as environment variables only.
- id: ketos-peer
  name: '@ketos/peer'
  disabled: false
  config:
    name: !!js process.env.KETOS_PARTICIPANT_NAME ?? ''
    relayUrls: !!js (process.env.KETOS_RELAY_URLS ?? '').split(',').filter(Boolean)
    keyPath: !!js dshHomePath('peer.key')
    peersPath: !!js dshHomePath('peers.json')

# Host log: the web profile ships no console exporter, so `ketos-peer`
# warnings (peer.connected, board.sync.too-large, bd errors) would stay
# invisible. The vendored exporter is loaded by path because it is not a
# dependency of any bundle; `docker compose logs` shows its lines.
- insert:
    - id: logger-console
      name: /app/vendor/logger-console/lib/index.js
      config:
        colors: false
        levels:
          default: 2
        showTime: 'yyyy-MM-dd hh:mm:ss '
