[project]
name = "kfx-duckduckgo"
version = "0.1.1"
description = "DuckDuckGo Search component as a standalone Ketos Extension Bundle."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [
    { name = "Ketos", email = "contact@ketos.test" },
]
keywords = ["ketos", "kfx", "extension", "bundle", "duckduckgo", "search"]

# Runtime deps: kfx (the BUNDLE_API surface) and the langchain-community
# binding that wraps the duckduckgo-search Python client.  kfx is floored at
# the current major.minor line (>=1.10.0) and capped below the next kfx major
# (<2.0.0) so the bundle resolves a compatible kfx; fine-grained BUNDLE_API
# compatibility is enforced separately via extension.json's
# "kfx": {"compat": [...]} contract.  langchain-community uses the same
# range the kfx tree does to keep co-installation lockstep.
dependencies = [
    "kfx>=1.10.0.dev0,<2.0.0",
    "langchain-community>=0.4.1,<1.0.0",
    "ddgs>=9.0.0",
]

[project.urls]
Homepage = "https://git.ketos.test/ketos/ketos"
Documentation = "https://docs.ketos.test/extensions"
Repository = "https://git.ketos.test/ketos/ketos"

# Manifest-shipping distributions are discovered via the
# ``ketos.extensions`` entry-point.  The value is the dotted path
# to the package containing ``extension.json`` -- the loader walks
# ``importlib.metadata.files()`` from there to find the manifest, and
# falls back to this entry-point for editable installs whose dist.files
# only surfaces dist-info entries.
[project.entry-points."ketos.extensions"]
kfx-duckduckgo = "kfx_duckduckgo"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# extension.json + components live inside the kfx_duckduckgo package so
# ``importlib.metadata.files(dist)`` finds them and the loader resolves
# bundles[].path relative to the manifest's directory.
packages = ["src/kfx_duckduckgo"]
include = ["src/kfx_duckduckgo/extension.json", "src/kfx_duckduckgo/components/**/*.py"]

[tool.hatch.build.targets.sdist]
include = [
    "src/kfx_duckduckgo",
    "extension.json",
    "README.md",
    "pyproject.toml",
]
