# Two Ketos instances beside each other, each with its own home volume,
# Syncthing home, published Web port and Syncthing UI port.
#
# The demonstration runs one service per computer: computer 1 runs
# `docker compose -f docker/stand/compose.yaml up -d ketos-a`, computer 2 runs
# the same with `ketos-b`, and each computer carries its own `docker/stand/.env`
# with its participant name (see .env.example). `../../.env` remains an
# optional source for values shared by the checkout (for example the model key).
#
name: ketos-stand

x-ketos-service: &ketos-service
  build:
    context: ../..
    dockerfile: docker/stand/Dockerfile
  image: ketos-stand:local
  init: true
  restart: unless-stopped
  env_file:
    - path: ../../.env
      required: false
    - path: .env
      required: false

services:
  ketos-a:
    <<: *ketos-service
    environment:
      KETOS_PORT: "3080"
      KETOS_TRUSTED_HOSTS: localhost
      KETOS_PARTICIPANT_NAME: ${KETOS_PARTICIPANT_NAME:-}
    ports:
      - "3080:3080"
      - "8384:8384"
    volumes:
      - ketos-a-home:/data/ketos
      - ketos-a-syncthing:/data/syncthing
      - ketos-stand-workspace:/workspace

  ketos-b:
    <<: *ketos-service
    environment:
      KETOS_PORT: "3081"
      KETOS_TRUSTED_HOSTS: localhost
      KETOS_PARTICIPANT_NAME: ${KETOS_PARTICIPANT_NAME:-}
    ports:
      - "3081:3081"
      - "8385:8384"
    volumes:
      - ketos-b-home:/data/ketos
      - ketos-b-syncthing:/data/syncthing
      - ketos-stand-workspace:/workspace

volumes:
  ketos-a-home:
  ketos-b-home:
  ketos-a-syncthing:
  ketos-b-syncthing:
  ketos-stand-workspace:
