[project]
name = "langflow"
version = "1.10.2"
description = "Compatibility metapackage for Ketos"
license = "MIT"
requires-python = ">=3.10,<3.15"
dependencies = ["ketos==1.10.2", "langflow-base==0.10.2"]

[project.scripts]
langflow = "ketos.ketos_launcher:main"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.sdist]
exclude = ["/tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.9.10",
]
