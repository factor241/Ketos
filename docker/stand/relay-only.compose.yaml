# Overlay for docker/stand/compose.yaml: ketos-a and ketos-b on separate bridge
# networks, so the only path between them is the team's iroh relay. The two
# services already have separate working directory volumes in the base file, so
# no file reaches the other side except through Syncthing.
#
#   docker compose -f docker/stand/compose.yaml -f docker/stand/relay-only.compose.yaml up -d
#
# Cut one side off the relay network and restore it with
# `docker network disconnect ketos-stand_net-b ketos-stand-ketos-b-1` and
# `docker network connect ketos-stand_net-b ketos-stand-ketos-b-1`.
services:
  ketos-a:
    networks: !override
      - net-a
  ketos-b:
    networks: !override
      - net-b
networks:
  net-a: {}
  net-b: {}
